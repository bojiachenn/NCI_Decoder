 取得的範例輸出。\n\n## 目錄\n\n| Package | 文件 | 內容 |\n|---|---|---|\n| `nfc_forum_2_0_pkg`（預設） | [NCI_Core.md](nfc_forum_2_0/NCI_Core.md) | GID 0x0 NCI Core（CORE_RESET / INIT / SET_CONFIG / GET_CONFIG / CONN_* ...） |\n| | [RF_Management.md](nfc_forum_2_0/RF_Management.md) | GID 0x1 RF Management（RF_DISCOVER / INTF_ACTIVATED / DEACTIVATE / Listen Mode Routing ...） |\n| | [NFCEE_Management.md](nfc_forum_2_0/NFCEE_Management.md) | GID 0x2 NFCEE Management |\n| | [Tables.md](nfc_forum_2_0/Tables.md) | `nfc_forum_2_0_pkg/__table__.py` 全部對照表 + MT/GID 表 |\n| `Nxp_pkg`（vendor = `Nxp`） | [NCI_Core.md](nxp/NCI_Core.md) | NXP 版 NCI Core（含 NXP 專屬 config parameter） |\n| | [RF_Management.md](nxp/RF_Management.md) | NXP 版 RF Management + SN2x0 擴充 NTF |\n| | [NFCEE_Management.md](nxp/NFCEE_Management.md) | NXP 版 NFCEE Management |\n| | [Proprietary.md](nxp/Proprietary.md) | GID 0xF Proprietary（2F/4F/6F） |\n| | [HDLL.md](nxp/HDLL.md) | NXP HDLL 下載協定（2-byte header + CRC16） |\n| | [Tables.md](nxp/Tables.md) | `Nxp_pkg/__table__.py` 全部對照表（含與 forum 版差異） |\n| `nfc_forum_2_3_pkg`（未接上 dispatch） | [README.md](nfc_forum_2_3/README.md) | NCI 2.3 相對 2.0 的增量 command 與表格 |\n\n## NCI 封包結構\n\n### Control Packet（CMD / RSP / NTF）\n\n```\nOctet 0                         Octet 1                 Octet 2          Octet 3..\n+-------+-----+---------+       +-----+-----------+     +-------------+  +---------+\n| MT(3) |PBF(1)| GID(4) |       | RFU | OID (6)   |     | Payload Len |  | Payload |\n+-------+-----+---------+       +-----+-----------+     +-------------+  +---------+\n```\n\n| MT (bits 7-5) | 類型 | Octet 0 高 nibble |\n|---|---|---|\n| `000b` | DATA | `0x0_` |\n| `001b` | CMD | `0x2_` |\n| `010b` | RSP | `0x4_` |\n| `011b` | NTF | `0x6_` |\n| `100b`-`111b` | RFU | — |\n\n| GID | 群組 | CMD / RSP / NTF 首 byte |\n|---|---|---|\n| `0000b` | NCI Core | `20` / `40` / `60` |\n| `0001b` | RF Management | `21` / `41` / `61` |\n| `0010b` | NFCEE Management | `22` / `42` / `62` |\n| `0011b` | NFCC Management | `23` / `43` / `63`（未實作 handler） |\n| `0100b` | Test Management | `24` / `44` / `64`（未實作 handler） |\n| `1111b` | Proprietary | `2F` / `4F` / `6F`（僅 Nxp_pkg） |\n\nPBF = 1 表示分段封包，decoder 會在輸出最後印出 `PBF: 1`。\n\n### Data Packet\n\n```\nOctet 0: MT=000 | PBF | Conn ID(4)    Octet 1: RFU(6) | Credits(2)    Octet 2: Payload Len    Octet 3..: Data\n```\n\nConn ID `0` = Static RF Connection（DH ↔ Remote NFC Endpoint）、`1` = Static HCI Connection、其他 = 動態分配。Data payload 目前只印 raw hex，不再解析。\n\n## 解碼流程（`nci_decoder/Decoder_Main.py` → `NFC_NCI_DECODER`）\n\n1. `vendor_registry.resolve(vendor)` 取得 package：`"Nxp"`（不分大小寫）→ `Nxp_pkg`，其他 → `nfc_forum_2_0_pkg`。\n2. 解析 Octet 0 → MT / PBF / GID，Octet 1 → OID，Octet 2 → Payload Length。\n3. 若 `Payload Length == 封包總長 - 3`：\n   - DATA → 直接印出 Conn ID / Credits / data。\n   - 控制封包 → 呼叫 `pkg.tbl_nci_ctrl[GID][OID][MT](payload_hex)`（定義於各 package 的 `__ctrl__.py`）；找不到則印 `<< ERROR_NOT_FOUND >>`。\n4. 否則若符合 NXP HDLL 長度規則（13-bit frame length == 封包總長 - 4）→ `pkg.HDLL(raw, mode)`，見 [nxp/HDLL.md](nxp/HDLL.md)。\n5. 都不符合 → `Error: Unknown raw data!`。\n\n每個 handler 以 `p_payload`（hex 字元 offset，1 byte = 2）逐欄解析並回傳最終 offset；若 ≠ `2 × (封包長 - 3)`，印出 `Error: Payload error!!` 與 `Check Len`。欄位值以 `NFC_table.tbl_xxx.get(value, "RFU")` 查表，查不到的值顯示 `RFU`。\n\n## 參考\n\n- NCI 2.0 規範與表格比對：`NCI_ref/NCI_commands_table_ref.md`（位於 repo 外的工作資料夾 `E:\\Project\\NCI_Decoder\\NCI_ref\\`，未納入版本控制）\n- 新增 command / vendor 的步驟：[`CLAUDE.md`](../CLAUDE.md)\n- 網頁版 parsing tool：[`Web_ver/`](../Web_ver/README.md)（其 Reference 頁面顯示的就是本資料夾的內容）\n',Bn=`# NFC Forum NCI 2.0 — NCI Core (GID 0x0) Command 文件

本文件說明 \`nfc_forum_2_0_pkg/NCI_Core.py\` 中所有 NCI Core 控制訊息（GID = 0x0，OID 0x00–0x09）的解析方式。
Dispatch 依 \`nfc_forum_2_0_pkg/__ctrl__.py\` 的 \`tbl_nci_ctrl["NCI Core"][oid][mt]\` 呼叫對應 handler；handler 收到的是 3-byte header 之後的 payload hex 字串，
以 \`p_payload\`（hex 字元數 = 2×bytes）逐欄前進並回傳最終 offset，若與宣告的 Payload Length 不符，\`Decoder_Main.py\` 會印出 \`Error: Payload error!!\`。
對照表皆來自 \`nfc_forum_2_0_pkg/__table__.py\`，以 \`range_lookup.lookup(NFC_table.tbl_xxx, value)\` 查找（先精確 key，再比對 \`'XX-YY'\` 範圍 key，皆無則 \`"RFU"\`），詳細內容見 [Tables.md](Tables.md)。

> 注意：\`Decoder_Main.py\` 呼叫 handler 時只傳入 \`raw\`（\`pkg.tbl_nci_ctrl[gid_val][oid][mt_val](raw[6::])\`），\`vendor\`/\`model\` 一律使用預設值 \`"None"\`，因此 handler 內部的 \`tbl_import\` 永遠解析到 \`nfc_forum_2_0_pkg.__table__\`。

## 總覽

| OID | CMD | RSP | NTF |
|---|---|---|---|
| 0x00 | \`20 00\` [CORE_RESET_CMD](#core_reset_cmd--20-00) | \`40 00\` [CORE_RESET_RSP](#core_reset_rsp--40-00) | \`60 00\` [CORE_RESET_NTF](#core_reset_ntf--60-00) |
| 0x01 | \`20 01\` [CORE_INIT_CMD](#core_init_cmd--20-01) | \`40 01\` [CORE_INIT_RSP](#core_init_rsp--40-01) | — |
| 0x02 | \`20 02\` [CORE_SET_CONFIG_CMD](#core_set_config_cmd--20-02) | \`40 02\` [CORE_SET_CONFIG_RSP](#core_set_config_rsp--40-02) | — |
| 0x03 | \`20 03\` [CORE_GET_CONFIG_CMD](#core_get_config_cmd--20-03) | \`40 03\` [CORE_GET_CONFIG_RSP](#core_get_config_rsp--40-03) | — |
| 0x04 | \`20 04\` [CORE_CONN_CREATE_CMD](#core_conn_create_cmd--20-04) | \`40 04\` [CORE_CONN_CREATE_RSP](#core_conn_create_rsp--40-04) | — |
| 0x05 | \`20 05\` [CORE_CONN_CLOSE_CMD](#core_conn_close_cmd--20-05) | \`40 05\` [CORE_CONN_CLOSE_RSP](#core_conn_close_rsp--40-05) | — |
| 0x06 | — | — | \`60 06\` [CORE_CONN_CREDITS_NTF](#core_conn_credits_ntf--60-06) |
| 0x07 | — | — | \`60 07\` [CORE_GENERIC_ERROR_NTF](#core_generic_error_ntf--60-07) |
| 0x08 | — | — | \`60 08\` [CORE_INTERFACE_ERROR_NTF](#core_interface_error_ntf--60-08) |
| 0x09 | \`20 09\` [CORE_SET_POWER_SUB_STATE_CMD](#core_set_power_sub_state_cmd--20-09) | \`40 09\` [CORE_SET_POWER_SUB_STATE_RSP](#core_set_power_sub_state_rsp--40-09) | — |

共 10 個 OID、18 個 handler。另有共用函式 [VALUE_OF_CFG_PARA](#附錄value_of_cfg_para--config-parameter-value-解析) 負責 SET_CONFIG / GET_CONFIG 的參數值解析。

範例皆以下列方式實際執行（vendor = \`'None'\`，mode = 2 不印 raw）：

\`\`\`
python -c "import sys; sys.path.insert(0, r'E:/Project/NCI_Decoder/NCI_Decoder/nci_decoder'); from Decoder_Main import NFC_NCI_DECODER; r='20000101'; NFC_NCI_DECODER(len(r)//2, r, 'None', 'None', 2)"

<a id="core_init_rsp"></a><a id="CORE_INIT_RSP"></a>
## CORE_INIT_RSP  (\`40 01\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | NCI Core / 0x01 / RSP |
| Handler | [\`NCI_Core.py:97\`](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L97) \`CORE_INIT_RSP\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Status | 1 | \`tbl_status_codes\`（見 [Tables](Tables.md#tbl_status_codes)） |
| 2 | NFCC Features | 4 | 先印 raw hex，再逐 octet 解 bit（見下表） |
| 3 | Max Logical Connections | 1 | ≥ 0x0F 且 vendor == \`"None"\` → \`RFU\`；否則印十進位 |
| 4 | Max Routing Table Size | 2 | little-endian 轉十進位，印 \`<n> (raw)\` |
| 5 | Max Control Packet Payload Size | 1 | < 32 → \`Invalid size\`；否則印十進位 |
| 6 | Max Data Packet Payload Size of the Static HCI Connection | 1 | 十進位 |
| 7 | Number of Credits of the Static HCI Connection | 1 | 十進位 |
| 8 | Max NFC-V RF Frame Size | 2 | little-endian 轉十進位，印 \`<n> (raw)\` |
| 9 | Number of Supported RF Interfaces (n) | 1 | 十進位 |
| 10 | Supported RF Interface [1..n] | x+2 每筆 | 先印剩餘所有 raw hex，再逐筆解析（見下） |
| ﹂ | Interface | 1 | \`tbl_rf_if\`（見 [Tables](Tables.md#tbl_rf_if)） |
| ﹂ | Number of Extensions (x) | 1 | 十進位 |
| ﹂ | Extension [0..x] | 1 each | \`tbl_rf_if_exten\`（見 [Tables](Tables.md#tbl_rf_if_exten)） |

#### NFCC Features bit 對應

| Octet | Bit | 欄位 | 解析 |
|---|---|---|---|
| 0 | b4 | Active Communication Mode | 1 = Support / 0 = Not support |
| 0 | b3 | HCI Network Support | 1 = Implements as defined in [ETSI_102622] / 0 = Not implement |
| 0 | b2–b1 | Discovery Cfg Mode | 00 = DH 為唯一設定者；01 = NFCC 可接收 DH 與其他 NFCEE 設定；其他 RFU |
| 0 | b0 | Discovery Freq Cfg | 1 = Supported in RF_DISCOVER_CMD / 0 = Ignored |
| 1 | b6..b1 | 路由能力 | \`tbl_nfcc_feat_oct1\`（見 [Tables](Tables.md#tbl_nfcc_feat_oct1)），key 為 bit 編號（int）；1 = Support |
| 2 | b3..b0 | 電源狀態能力 | \`tbl_nfcc_feat_oct2\`（見 [Tables](Tables.md#tbl_nfcc_feat_oct2)），key 為 bit 編號（int）；1 = Support |
| 3 | 全部 | Proprietary | 只印二進位，後綴 \`-- Proprietary\` |

### 範例
- Raw：\`40 01 15 00 11 1E 0E 00 08 00 02 FF FF 01 01 00 03 01 00 02 00 03 01 01\`

\`\`\`text
  << CORE_INIT_RSP >>  
  * Status: STATUS_OK (00)
  * NFCC Features: 111E0E00

    * Octet 0: 00010001
     ~ Active Communication Mode:       Support
     ~ HCI Network Support:             Not implement
     ~ Discovery Cfg Mode:              The DH is the only entity that configs the NFCC.
     ~ Discovery Freq Cfg:              Supported in RF_DISCOVER_CMD

    * Octet 1: 00011110
     ~ Forced NFCEE routing:            Not support
     ~ APDU Pattern based routing:      Not support
     ~ System Code based routing:       Support
     ~ AID based routing:               Support
     ~ Protocol based routing:          Support
     ~ Technology based routing:        Support

    * Octet 2: 00001110
     ~ RF Cfg in Switched Off State:    Support
     ~ Switched On Sub-Mode States:     Support
     ~ Switched Off State:              Support
     ~ Battery Off State:               Not support

    * Octet 3: 00000000 -- Proprietary

  * Max Logical Connections: 8 (08)
  * Max Routing Table Size: 512 (0002)
  * Max Control Packet Payload Size: 255 (FF)
  * Max Data Packet Payload Size of the Static HCI Connection: 255 (FF)
  * Number of Credits of the Static HCI Connection: 1 (01)
  * Max NFC-V RF Frame Size: 1 (0100)
  * Number of Supported RF Interfaces: 3
  * Supported RF Interface: 01000200030101

   ~ [RF_IF_0] ~  
    * Interface: Frame (01)
    * Number of Extensions: 0

   ~ [RF_IF_1] ~  
    * Interface: ISO-DEP (02)
    * Number of Extensions: 0

   ~ [RF_IF_2] ~  
    * Interface: NFC-DEP (03)
    * Number of Extensions: 1
    * Extension 0: LLCP Symmetry RF Interface Extension (01)
#end
\`\`\`

### 實作備註
- ✅ 已修正（2026-10）：Max Routing Table Size、Max NFC-V RF Frame Size 以 little-endian 轉十進位並附 raw hex（如 \`512 (0002)\`）。
- \`Supported RF Interface:\` 行印的是 \`raw[p_payload:]\`（payload 剩餘全部內容），而非僅限 RF Interface 區段。
- Max Logical Connections 的 RFU 判斷依賴 \`vendor == "None"\`；由於 dispatch 不傳 vendor，實際上永遠成立。
- 各 octet 中未列出的 bit（例如 Octet 0 b7–b5、Octet 1 b7/b0、Octet 2 b7–b4）不解析。

## CORE_CONN_CREATE_CMD  (\`20 04\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | NCI Core / 0x04 / CMD |
| Handler | [\`NCI_Core.py:378\`](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L378) \`CORE_CONN_CREATE_CMD\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Destination Type | 1 | \`tbl_dest_type\`（見 [Tables](Tables.md#tbl_dest_type)） |
| 2 | Number of Destination-specific Parameters (n) | 1 | 十進位 |
| 3 | Destination-specific Parameter [0..n]（TLV） | m+2 每筆 | 每筆印 \`~ [Dest-spec Parameter_i] ~\` |
| ﹂ | Type | 1 | \`tbl_d_spec_type\`（見 [Tables](Tables.md#tbl_d_spec_type)） |
| ﹂ | Len (m) | 1 | 十進位 |
| ﹂ | Val | m | 先印 raw hex，再依 Type 分支解析（見下） |

#### Val 依 Type 分支

| Type | Val Octet | 欄位 | 解析 |
|---|---|---|---|
| \`00\` | 0 | RF Discovery ID | \`lookup(tbl_rf_dis_id, v)\`（見 [Tables](Tables.md#tbl_rf_dis_id)）：\`00\`/\`FF\` → \`RFU\`，\`01\`–\`FE\` → \`Dynamically assigned by the NFCC\`；印 \`<text> (raw)\` |
| \`00\` | 1 | RF Protocol | \`tbl_rf_proto\`（見 [Tables](Tables.md#tbl_rf_proto)） |
| \`01\` | 0 | NFCEE ID | \`lookup(tbl_nfcee_id, v)\`（見 [Tables](Tables.md#tbl_nfcee_id)），去掉表值外層括號後印 \`<text> (raw)\`：\`00\` → \`DH-NFCEE\`、\`01\` → \`HCI-NTWK-NFCEE (RFU)\`、\`02\`–\`0F\` → \`Static IDs\`、\`10\`–\`7F\` → \`NFCEE\`、\`80\`–\`FE\` → \`HCI-NFCEE\`、\`FF\` → \`RFU\` |
| \`01\` | 1 | NFCEE Interface Protocol | \`tbl_nfcee_proto\`（見 [Tables](Tables.md#tbl_nfcee_proto)） |
| 其他 | — | — | 印一行 \`~ Type <xx>: For proprietary use\`（Type ≥ 0xA0）或 \`~ Type <xx>: RFU\`（其他） |

### 範例
- Raw：\`20 04 06 02 01 00 02 01 04\`（Remote NFC Endpoint）

\`\`\`text
  << CORE_CONN_CREATE_CMD >>  
  * Destination Type: Remote NFC Endpoint (02)
  * Number of Destination-specific Params: 1

   ~ [Dest-spec Parameter_0] ~  
    * Type: RF Discovery ID + RF Protocol (00)
    * Len: 2
    * Val: 0104
      * RF Discovery ID: Dynamically assigned by the NFCC (01)
      * RF Protocol: ISO-DEP (04)
#end
\`\`\`

- Raw：\`20 04 06 03 01 01 02 80 00\`（NFCEE）

\`\`\`text
  << CORE_CONN_CREATE_CMD >>  
  * Destination Type: NFCEE (03)
  * Number of Destination-specific Params: 1

   ~ [Dest-spec Parameter_0] ~  
    * Type: NFCEE ID + NFCEE Interface Protocol (01)
    * Len: 2
    * Val: 8000
      * NFCEE ID: HCI-NFCEE (80)
      * NFCEE Interface Protocol: APDU (00)
#end
\`\`\`

### 實作備註
- ✅ 已修正（2026-10）：NFCEE ID 只印一行，依實際值所屬範圍顯示對應名稱。
- ✅ 已修正（2026-10）：NFCEE ID 改用 \`lookup(tbl_nfcee_id, ...)\` 查表（含範圍 key）。
- ✅ 已修正（2026-10）：RF Discovery ID 改用 \`lookup\`，\`01\`–\`FE\` 命中 \`'01-FF'\` 範圍 key 顯示 \`Dynamically assigned by the NFCC\`，\`FF\` 仍為 \`RFU\`。
- ✅ 已修正（2026-10）：未知 Type 時 \`Val:\` 只印一次，另附一行 \`~ Type <xx>: For proprietary use / RFU\`。
- \`tbl_dest_type\` 無 \`00\` 項，0x00 及 0x04 以上顯示 \`RFU\`。

## 附錄：VALUE_OF_CFG_PARA — Config Parameter Value 解析

| 項目 | 值 |
|---|---|
| Handler | [\`NCI_Core.py:656\`](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L656) \`VALUE_OF_CFG_PARA(id, val, NFC_table)\` |
| 呼叫者 | CORE_SET_CONFIG_CMD、CORE_GET_CONFIG_RSP（僅在 Len ≠ 0 時呼叫） |
| 長度檢查 | 1-octet bit-field 參數（\`CFG_BITFIELD_1OCT\`：\`02\`、\`13\`、\`2A\`、\`30\`、\`31\`、\`32\`、\`38\`、\`3C\`、\`50\`、\`5C\`、\`62\`、\`82\`、\`85\`）若 Len > 1，只以第 1 octet 解析，並在該參數輸出最後加一行 \`* Warning: Len <m>, expected 1 (raw <val>)\` |
| ID 名稱表 | \`tbl_cfg_para\`（見 [Tables](Tables.md#tbl_cfg_para)） |

\`id\` 為 1-octet hex 字串（大寫），\`val\` 為整段 Value 的 hex 字串。下表中的 bit 編號以 b7（MSB）… b0（LSB）表示；程式內以 \`val_b = bin(int(val,16))[2:].zfill(8)\` 取得字串，\`val_b[k]\` 對應 b(7−k)。

### 程式支援的 Parameter ID 與 Value 解析方式

| ID | 名稱 | Value 解析方式 |
|---|---|---|
| \`00\` | TOTAL_DURATION | 取前 2 octets 以 little-endian 轉十進位，印 \`<n> ms (raw)\` |
| \`02\` | CON_DISCOVERY_PARAM | 印 8-bit 二進位；b0 = 1 → \`Polling Mode: Enabled\`，否則 Disabled；b1 = 1 → \`DH-NFCEE: Disabled\`，否則 Enabled |
| \`03\` | POWER_STATE | 印 raw；\`02\` → \`Current CORE_GET_CONFIG_CMD apply for Switched Off State\`，其他 → \`RFU\` |
| \`08\` / \`11\` / \`19\` | PA_BAIL_OUT / PB_BAIL_OUT / PF_BAIL_OUT | 印 raw；\`00\` → Not apply，\`01\` → Apply，其他 → RFU；技術名稱依 ID 對應 NFC-A / NFC-B / NFC-F |
| \`09\` / \`14\` / \`1A\` / \`2F\` | PA / PB / PF / PV_DEVICES_LIMIT | 印 raw + 固定說明 \`As defined in [ACTIVITY] for the Collision Resolution Activity.\` |
| \`10\` | PB_AFI | 印 raw + 固定說明（Application family identifier） |
| \`12\` | PB_ATTRIB_PARAM1 | 印 raw + 固定說明（ATTRIB Param 1） |
| \`13\` | PB_SENSB_REQ_PARAM | 印 8-bit 二進位；b4 = 1 → \`Extended SENSB_RES: Support\`，否則 Not support |
| \`18\` / \`21\` / \`3E\` / \`5B\` / \`68\` | PF_BIT_RATE / PI_BIT_RATE / LB_BIT_RATE / LI_A_BIT_RATE / PACM_BIT_RATE | \`BIT_RATE_TEXT\`：查 \`tbl_bit_rates\`（見 [Tables](Tables.md#tbl_bit_rates)）；未定義值中 \`80\`–\`FE\` → \`For proprietary use\`，其餘 → \`RFU\` |
| \`20\` | PI_B_H_INFO | 印 raw + 固定說明（Higher layer INF of ATTRIB） |
| \`28\` | PN_NFC_DEP_PSL | 印 raw；\`00\` → Highest available，\`01\` → Maintain，其他 → RFU |
| \`29\` | PN_ATR_REQ_GEN_BYTES | 印 raw + 固定說明 \`General Bytes for ATR_REQ.\` |
| \`2A\` / \`62\` | PN_ATR_REQ_CONFIG / LN_ATR_RES_CONFIG | 印 8-bit 二進位 + \`NOTE: Needs to be always set to 0x30 for LLCP\`；\`Value for LR\` = b5–b4 |
| \`30\` | LA_BIT_FRAME_SDD | 印 8-bit 二進位 + 固定說明（5-bit value，SENS_RES Byte 1） |
| \`31\` | LA_PLATFORM_CONFIG | 印 8-bit 二進位 + 固定說明（4-bit value，SENS_RES Byte 2） |
| \`32\` | LA_SEL_INFO | 印 8-bit 二進位；b6 → NFC-DEP Protocol Supported/Not supported；b5 → ISO-DEP Protocol Supported/Not supported |
| \`33\` | LA_NFCID1 | 印 raw + 固定說明 |
| \`38\` | LB_SENSB_INFO | 印 8-bit 二進位；b0 → ISO-DEP Protocol Supported/Not supported |
| \`39\` | LB_NFCID0 | 印 raw + 固定說明 |
| \`3A\` | LB_APPLICATION_DATA | 印 raw + 固定說明（SENSB_RES Bytes 6-9） |
| \`3B\` | LB_SFGI | 印 raw + 固定說明 |
| \`3C\` | LB_FWI_ADC_FO | 印 8-bit 二進位；FWI = b7–b4（十進位 + 二進位）；ADC b3 欄位印 b3 的值；DID 印 b0 的值 |
| \`40\`–\`4F\` | LF_T3T_IDENTIFIERS_1..16 | 印 raw；\`val[0:4]\` = System Code（2 octets），\`val[4:20]\` = NFCID2（8 octets），\`val[20:36]\` = PAD0/PAD1/MRTI_check/MRTI_update/PAD2（8 octets） |
| \`50\` | LF_PROTOCOL_TYPE | 印 8-bit 二進位；b1 → NFC-DEP Protocol Supported/Not supported |
| \`52\` | LF_T3T_MAX | 值 ≤ 16 印十進位，否則 \`RFU (raw)\` |
| \`53\` | LF_T3T_FLAGS | 2 octets；印兩個 8-bit 二進位；Octet0 b0..b7 對應 IDENTIFIERS_1..8，Octet1 b0..b7 對應 IDENTIFIERS_9..16；1 = Enabled，0 = Disabled |
| \`55\` | LF_T3T_RD_ALLOWED | \`00\` → SHALL NOT include RD bytes；\`01\` → MAY include RD bytes；其他 → \`RFU (raw)\` |
| \`58\` | LI_A_RATS_TB1 | 印 raw + 固定說明 |
| \`59\` | LI_A_HIST_BY | 印 raw + 固定說明（Historical Bytes） |
| \`5A\` | LI_B_H_INFO_RESP | 印 raw + 固定說明 |
| \`5C\` | LI_A_RATS_TC1 | 印 8-bit 二進位；DID 說明後附 b1 的值 |
| \`60\` | LN_WT | WT 指數：印 \`<n> (raw)\`；n ≤ 14 時附 \`RWT = 256*16/fc * 2^WT = <x.xxx> ms\`，n > 14 附 \`RFU (WT > 14)\` |
| \`61\` | LN_ATR_RES_GEN_BYTES | 印 raw + 固定說明 |
| \`80\` | RF_FIELD_INFO | \`00\` → \`RF_FIELD_INFO_NTF: Disabled\`；\`01\` → Enabled；其他 → \`RFU (raw)\` |
| \`81\` | RF_NFCEE_ACTION | \`00\` → \`RF_NFCEE_ACTION_NTF: Disabled\`；\`01\` → Enabled；其他 → \`RFU (raw)\` |
| \`82\` | NFCDEP_OP | 印 8-bit 二進位；b4：1 → \`Waiting Time: <= 10\`，0 → \`<= WT_(NFCDEP,MAX)\`；b3 = 1 → chaining PDU 必須用最大 Transport Data Bytes；b2 = 1 → 不送無資料 Info PDU；b1 = 1 → Initiator 僅以 ATTENTION 做錯誤復原；b0 = 1 → Target 不送 RTOX（各 bit 為 0 時不印） |
| \`83\` | LLCP_VERSION | 高 nibble = major、低 nibble = minor，印 \`major.minor (raw)\` |
| \`85\` | NFCC_CONFIG_CONTROL | 印 8-bit 二進位；b0 = 0 → NFCC is not allowed to manage RF config；b0 = 1 → allowed |
| 其他 | （含 RFU、0xA0–0xFE proprietary、\`84\` 等；ID 名稱經 \`lookup\` 範圍 key 顯示 \`RFU\` / \`Reserved\`） | 只印 \`Val: <raw>\` |

`,Vn=`# NFCEE Management（GID = 0x2）— nfc_forum_2_0_pkg

本文件說明 \`nci_decoder/nfc_forum_2_0_pkg/NFCEE_Management.py\` 中所有 NFCEE Management 控制訊息的解析方式。Dispatch 依 \`nfc_forum_2_0_pkg/__ctrl__.py\` 中 \`tbl_nci_ctrl["NFCEE Management"]\` 群組（OID 0x00 ~ 0x03，0x04 ~ 0x3F 為 RFU、未登錄）。vendor 傳 \`'None'\`（或任何非 \`Nxp\` 的值）時走 \`nfc_forum_2_0_pkg\`。

每個 handler 收到的是 3-byte header 之後的 payload hex 字串，以 \`p_payload\`（hex 字元數 = 2×bytes）往前走並回傳最終 offset；\`Decoder_Main.py\` 會比對回傳值與 header 宣告的 Payload Length，不一致時印出 \`Payload error!!\`。表格查找使用 \`NFC_table.tbl_xxx.get(value, "RFU")\`，\`NFC_table\` 來自 \`nfc_forum_2_0_pkg/__table__.py\`（各表內容見 [Tables.md](Tables.md)）。

> 注意：\`Decoder_Main.py\` 呼叫 handler 時只傳入 \`raw\`（\`pkg.tbl_nci_ctrl[gid_val][oid][mt_val](raw[6::])\`），所以 handler 的 \`vendor\` / \`model\` 參數一律為預設值 \`"None"\`，\`pkg_import.tbl_import()\` 永遠載入 \`nfc_forum_2_0_pkg.__table__\`。

## 總覽

| OID | CMD | RSP | NTF | Handler |
|---|---|---|---|---|
| 0x00 | \`22 00\` | \`42 00\` | \`62 00\` | [NFCEE_DISCOVER_CMD](#nfcee_discover_cmd--22-00) / [NFCEE_DISCOVER_RSP](#nfcee_discover_rsp--42-00) / [NFCEE_DISCOVER_NTF](#nfcee_discover_ntf--62-00) |
| 0x01 | \`22 01\` | \`42 01\` | \`62 01\` | [NFCEE_MODE_SET_CMD](#nfcee_mode_set_cmd--22-01) / [NFCEE_MODE_SET_RSP](#nfcee_mode_set_rsp--42-01) / [NFCEE_MODE_SET_NTF](#nfcee_mode_set_ntf--62-01) |
| 0x02 | — | — | \`62 02\` | [NFCEE_STATUS_NTF](#nfcee_status_ntf--62-02) |
| 0x03 | \`22 03\` | \`42 03\` | — | [NFCEE_POWER_AND_LINK_CNTRL_CMD](#nfcee_power_and_link_cntrl_cmd--22-03) / [NFCEE_POWER_AND_LINK_CNTRL_RSP](#nfcee_power_and_link_cntrl_rsp--42-03) |

<a id="nfcee_discover_ntf"></a><a id="NFCEE_DISCOVER_NTF"></a>
## NFCEE_DISCOVER_NTF  (\`62 00\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | NFCEE Management / 0x00 / NTF |
| Handler | [\`NFCEE_Management.py:41\`](../../nci_decoder/nfc_forum_2_0_pkg/NFCEE_Management.py#L41) \`NFCEE_DISCOVER_NTF\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | NFCEE ID | 1 | \`tbl_nfcee_id\`（見 [Tables](Tables.md#tbl_nfcee_id)）：同時印出「精確 key 查表結果」與「\`range_lookup.find_range_key\` 找到的範圍 key 查表結果」，查不到的部分印空字串 |
| 2 | NFCEE Status | 1 | \`tbl_nfcee_disc_status\`（見 [Tables](Tables.md#tbl_nfcee_disc_status)），精確查表，查無則 \`RFU\` |
| 3 | Number of Protocol Information Entries (n) | 1 | 十進位整數 |
| 4 | Supported NFCEE Protocols | n | 逐 byte 以 \`range_lookup.lookup(tbl_nfcee_proto, …)\`（見 [Tables](Tables.md#tbl_nfcee_proto)）查表（含 \`'04-7F'\`/\`'80-FE'\` 範圍 key），查無則 \`RFU\`；n = 0 時跳過（但仍印一個空行） |
| 5 | Number of NFCEE Information TLVs (m) | 1 | 十進位整數 |
| 6 | NFCEE Information TLV [0..m-1] | 每個 x+2 | 見下方 TLV 說明；m = 0 時跳過 |
| ﹂ | Type | 1 | 先用 \`find_range_key(tbl_tlv_type, …)\` 轉成範圍 key（無範圍命中則保留原值），再以 \`tbl_tlv_type\`（見 [Tables](Tables.md#tbl_tlv_type)）查表；括號內印原始 byte |
| ﹂ | Length (x) | 1 | 十進位整數 |
| ﹂ | Value | x | 一律先印原始 hex；Type 為 \`02\` / \`04\` 時再進一步解析（見下） |
| 7 | NFCEE Power Supply | 1 | 硬編碼：\`00\` → \`NFCC control power supply for any NFCEE_UICCx\`；\`01\` → \`NFCC control power supply for NFCEE_eSE and NFCEE_NDEF\`；其他 → \`RFU (xx)\` |

**TLV Type \`02\`（T3T Command Set Interface Supplementary Information）Value 解析：**

| # | 欄位 | 長度 (Octets) | 解析方式 |
|---|---|---|---|
| 1 | PMm | 8 | 原始 hex |
| 2 | Number of Entries (k) | 1 | 十進位整數 |
| 3 | Entry [0..k-1] | 每個 10 | |
| ﹂ | System Code | 2 | 原始 hex |
| ﹂ | Idm | 8 | 原始 hex |

**TLV Type \`04\`（NDEF）Value 解析：**

| # | 欄位 | 長度 (Octets) | 解析方式 |
|---|---|---|---|
| 1 | NDEF max size | 4 | 將 4 bytes **反轉 byte 順序**（以 little-endian 解讀）後轉十進位，單位 Bytes；括號內印原始 hex |
| 2 | Power State | 1 | 印 8-bit 二進位，再對 bit 5 ~ bit 0 逐一以 \`tbl_pwr_state\`（見 [Tables](Tables.md#tbl_pwr_state)）取名稱，bit = 1 印 \`Apply\`、0 印 \`Not apply\` |
| 3 | NDEF-NFCEE characteristics | 1 | 只看 bit 0：\`0\` → \`Not persistent\`，\`1\` → \`Persistent\` |

Power State bit 對應（來自 \`tbl_pwr_state\`）：

| Bit | 意義 |
|---|---|
| b7 ~ b6 | 不解析（表中為註解掉的 RFU） |
| b5 | Screen Off lock (Sub-State 3) |
| b4 | Screen On lock (Sub-State 2) |
| b3 | Screen off unlock (Sub-State 1) |
| b2 | Battery Off State |
| b1 | Switch Off State |
| b0 | Switch On State |

其他 TLV Type（\`00\` Hardware / Registration Identification、\`01\` ATR Bytes、\`03\` Host ID in the HCI Network、RFU、proprietary）只印 Type / Len / Val 原始 hex，不再細部解析。

### 範例
- Raw（HCI-NFCEE，APDU，Hardware/Registration ID TLV）：\`62 00 0A 86 00 01 00 01 00 02 11 22 01\`

  * NFCEE ID: 86  (HCI-NFCEE)
  * NFCEE Status: Enabled (00)
  * Number of Protocol Info Entries: 1
  * Supported NFCEE Protocols: APDU (00), 
  * Number of NFCEE Info TLVs: 1
  * NFCEE Information:

   ~ [NFCEE Info TLV_0] ~  
    * Type: Hardware / Registration Identification (00)
    * Len: 2
    * Val: 1122

  * NFCEE Power Supply: NFCC control power supply for NFCEE_eSE and NFCEE_NDEF
#end
\`\`\`

- Raw（T3T Command Set Interface Supplementary Information TLV）：\`62 00 1B 10 00 01 02 01 02 13 01 02 03 04 05 06 07 08 01 12 FC 02 FE 00 01 02 03 04 05 00\`

\`\`\`text

  * NFCEE ID: 10  (NFCEE)
  * NFCEE Status: Enabled (00)
  * Number of Protocol Info Entries: 1
  * Supported NFCEE Protocols: Type 3 Tag Command Set (02), 
  * Number of NFCEE Info TLVs: 1
  * NFCEE Information:

   ~ [NFCEE Info TLV_0] ~  
    * Type: T3T Command Set Interface Supplementary Information (02)
    * Len: 19
    * Val: 01020304050607080112FC02FE000102030405
      * PMm: 0102030405060708
      * Number of Entries: 1
       ~ [Entry_0] ~   
        * System Code: 12FC
        * Idm: 02FE000102030405

  * NFCEE Power Supply: NFCC control power supply for any NFCEE_UICCx
#end
\`\`\`

- Raw（NDEF TLV）：\`62 00 0E 10 00 01 03 01 04 06 00 10 00 00 3F 01 01\`

\`\`\`text
  << NFCEE_DISCOVER_NTF >>  
  * NFCEE ID: 10  (NFCEE)
  * NFCEE Status: Enabled (00)
  * Number of Protocol Info Entries: 1
  * Supported NFCEE Protocols: Transparent (03), 
  * Number of NFCEE Info TLVs: 1
  * NFCEE Information:

   ~ [NFCEE Info TLV_0] ~  
    * Type: NDEF (04)
    * Len: 6
    * Val: 001000003F01
      * NDEF max size: 4096 Bytes (00100000)
      * Power State: 00111111 (3F)
       ~ Screen Off lock (Sub-State 3):    Apply     
       ~ Screen On lock (Sub-State 2):     Apply     
       ~ Screen off unlock (Sub-State 1):  Apply     
       ~ Battery Off State:                Apply     
       ~ Switch Off State:                 Apply     
       ~ Switch On State:                  Apply     
      * NDEF-NFCEE characteristics: Persistent

  * NFCEE Power Supply: NFCC control power supply for NFCEE_eSE and NFCEE_NDEF
#end
\`\`\`

- Raw（無 Protocol、proprietary TLV Type、RFU Power Supply）：\`62 00 07 81 02 00 01 A1 00 05\`

\`\`\`text
  << NFCEE_DISCOVER_NTF >>  
  * NFCEE ID: 81  (HCI-NFCEE)
  * NFCEE Status: Unresponsive (02)
  * Number of Protocol Info Entries: 0

  * Number of NFCEE Info TLVs: 1
  * NFCEE Information:

   ~ [NFCEE Info TLV_0] ~  
    * Type: For proprietary use (A1)
    * Len: 0
    * Val: 

  * NFCEE Power Supply: RFU (05)
#end
\`\`\`

- Raw（DH-NFCEE，proprietary protocol 值）：\`62 00 06 00 00 01 80 00 00\`

\`\`\`text

  * NFCEE ID: 00 DH-NFCEE 
  * NFCEE Status: Enabled (00)
  * Number of Protocol Info Entries: 1
  * Supported NFCEE Protocols: For proprietary use (80), 
  * Number of NFCEE Info TLVs: 0

  * NFCEE Power Supply: NFCC control power supply for any NFCEE_UICCx
#end
\`\`\`

### 實作備註
- ✅ 已修正（2026-10）：Supported NFCEE Protocols 改用 \`range_lookup.lookup\`，\`0x80\`~\`0xFE\` 顯示 \`For proprietary use\`（見上方 \`62 00 06 00 00 01 80 00 00\` 範例）。
- **NFCEE Status 未做範圍查表**：\`tbl_nfcee_disc_status\` 的 \`'03-FF'\` 範圍 key 不會被命中，但 fallback 值剛好也是 \`RFU\`，輸出結果一致。
- NFCEE ID 的輸出格式為 \`NFCEE ID: <hex> <精確值> <範圍值>\`，因兩者其中之一必為空字串，輸出會出現連續兩個空白（例如 \`10  (NFCEE)\`）或行尾多一個空白（例如 \`00 DH-NFCEE \`）。
- Supported NFCEE Protocols 每個項目後都印 \`, \`，最後一項也帶逗號。
- NDEF TLV 的 \`NDEF max size\` 程式以 byte 反序（little-endian）解讀 4 bytes；NDEF TLV / T3T TLV 的子欄位解析不檢查 Length 是否足夠，Value 過短時會以空字串切片（\`int('', 16)\` 可能拋例外）。
- NFCEE Power Supply 的意義字串為硬編碼（未使用 \`__table__.py\` 對照表）。

### 實作備註
- 原始碼第 264 行函式上方的註解寫成 \`# 22 03\`，實際 RSP header 應為 \`42 03\`（僅註解誤植，不影響 dispatch）。
`,Hn=`# NFC Forum NCI 2.0 — RF Management (GID 0x1)

本文件說明 \`nfc_forum_2_0_pkg/RF_Management.py\` 中所有 RF Management 控制訊息 handler 的 payload 解析方式。Dispatch 依 [\`__ctrl__.py\`](../../nci_decoder/nfc_forum_2_0_pkg/__ctrl__.py#L21) 的 \`"RF Management"\` 群組（OID 0x00–0x11，0x12–0x3F 為 RFU）。CMD header 首 byte 為 \`21\`、RSP 為 \`41\`、NTF 為 \`61\`。

Handler 收到的 \`raw\` 是 3-byte header 之後的 payload hex 字串，以 \`p_payload\`（hex 字元 offset，1 octet = 2 字元）向後解析，最後回傳 offset；\`Decoder_Main.NFC_NCI_DECODER\` 會比對回傳值與 header 宣告的長度，不一致時印出 \`Error: Payload error!!\`。所有對照表都來自 \`nfc_forum_2_0_pkg/__table__.py\`（透過 \`__pkg_import__.tbl_import(vendor, model)\` 載入）。注意：\`Decoder_Main\` 呼叫 handler 時只傳入 \`raw\`（\`pkg.tbl_nci_ctrl[gid][oid][mt](raw[6::])\`），所以 handler 內的 \`vendor\`/\`model\` 永遠是預設值 \`"None"\`，一律使用 nfc_forum_2_0 的表。

除非另外註明，表格查詢皆使用 \`range_lookup.lookup(NFC_table.tbl_xxx, value)\`：先精確鍵值，再比對 \`'XX-YY'\` 範圍鍵（例如 \`'80-FE'\`），都沒有才回傳 \`RFU\`。仍使用 \`.get()\` 的少數欄位（RF Discovery ID、NFCEE ID 等）各節會特別說明。

含內部長度欄位的子結構（Routing Entry Value、RF Technology Specific Parameters、Activation Parameters、Information Entry Value）都以宣告的長度為界解析：內部欄位超出宣告長度時印 \`  * Error: <結構名稱>: Payload too short: need <k> byte(s) for <欄位>, <r> left\`，然後從宣告長度之後繼續解析。

本文件的範例都是用 \`NFC_NCI_DECODER(len(raw)//2, raw, 'None', 'None', 2)\`（vendor = \`'None'\`，mode = 2，不印 raw）實際執行後取得的輸出。

## 共用結構 A LISTEN_MODE_ROUTING_INFO

| 項目 | 值 |

| Handler | [\`RF_Management.py:97\`](../../nci_decoder/nfc_forum_2_0_pkg/RF_Management.py#L97) \`LISTEN_MODE_ROUTING_INFO\` |
| 使用者 | [RF_SET_LISTEN_MODE_ROUTING_CMD](#rf_set_listen_mode_routing_cmd--21-01)、[RF_GET_LISTEN_MODE_ROUTING_NTF](#rf_get_listen_mode_routing_ntf--61-02) |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | More | 1 | \`tbl_more\`（見 [Tables](Tables.md#tbl_more)） |
| 2 | Number of Routing Entries | 1 (n) | 十進位顯示 |
| 3 | Routing Entry [1..n] | x+2 | 每筆為 TLV，見下 |
| ﹂ | Qualifier-Type (Type) | 1 | 低 nibble 查 \`tbl_L_mode_routing_entry_type\`（見 [Tables](Tables.md#tbl_L_mode_routing_entry_type)）；高 nibble 依 Table 52 解 bit flag（見下） |
| ﹂ | Length | 1 (x) | 十進位顯示 |
| ﹂ | Value | x | 先整串印出 \`Val:\`，再依 Type 拆解（見下表） |

**Qualifier-Type bit field（Table 52，程式直接實作在 code 中）**

| Bit | 意義（程式印出的文字） |
|---|---|
| b7 | RFU（程式不檢查） |
| b6 | \`Routing is blocked for the power modes where it is not supported.\` |
| b5 | \`Match is allowed when the SELECT AID is shorter than the AID in this routing table entry.\` |
| b4 | \`Match is allowed when the SELECT AID is longer than the AID in this routing table entry.\` |
| b3–b0 | Routing Entry Type（\`tbl_L_mode_routing_entry_type\`） |

**Value 欄位共同前綴（所有 Type 都先解這兩個 octet）**

| # | 欄位 | 長度 | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Route | 1 | \`tbl_nfcee_id\`（見 [Tables](Tables.md#tbl_nfcee_id)）：先精確查詢（查不到就印原值），再用 \`range_lookup.find_range_key\` 找範圍鍵（\`02-0F\`/\`10-7F\`/\`80-FE\`）附加說明 |
| 2 | Power State | 1 | 印出 8-bit 二進位，再對 bit5..bit0 逐一查 \`tbl_pwr_state\`（見 [Tables](Tables.md#tbl_pwr_state)），1 = \`Apply\`、0 = \`Not apply\` |

**Power State bit 對應（\`tbl_pwr_state\`，Table 59）**

| Bit | 意義 |
|---|---|
| b7–b6 | RFU（不印） |
| b5 | Screen Off lock (Sub-State 3) |
| b4 | Screen On lock (Sub-State 2) |
| b3 | Screen off unlock (Sub-State 1) |
| b2 | Battery Off State |
| b1 | Switch Off State |
| b0 | Switch On State |

**依 Routing Entry Type 的 Value 其餘欄位**

| Type (低 nibble) | 名稱 | Value 格式（Route + Power State 之後） | 解析方式 |
|---|---|---|---|
| \`0\` | Technology-based routing entry（Table 54） | Technology：1 octet | \`tbl_rf_tech\`（見 [Tables](Tables.md#tbl_rf_tech)） |
| \`1\` | Protocol-based routing entry（Table 55） | Protocol：1 octet | \`tbl_rf_proto\`（見 [Tables](Tables.md#tbl_rf_proto)），\`lookup\` 可解析 \`80-FE\` proprietary |
| \`2\` | AID-based routing entry（Table 56） | AID：0–16 octets | 不查表；Route + Power State 之後剩餘的 octets（> 0 時）整段印 hex |
| \`3\` | System Code-based routing entry（Table 57） | SC Route List：2n octets | 依 \`(x-2)//2\` 筆，每筆 2 octet 印 hex，標籤為 \`SC Route <j>\`（j = SC 索引） |
| \`4\` | APDU Pattern-based routing entry（Table 58） | Reference data：n octets、Mask：n octets（n = (x-2)//2） | 各印完整 n octets 的 hex |
| 其他 | — | — | 只印 Type \`RFU\`、Route、Power State，不再拆解 |

### 實作備註
- ✅ 已修正（2026-10）：AID-based（Type 2）只要 Route + Power State 之後還有資料就印 \`AID:\`，1–2 octets 的 AID 也會印出（見第二個範例）。
- ✅ 已修正（2026-10）：System Code-based（Type 3）的標籤改用 SC 自己的索引（\`SC Route 0\`、\`SC Route 1\`…）。
- ✅ 已修正（2026-10）：APDU Pattern-based（Type 4）的 Reference data 與 Mask 各印完整 n = (x-2)//2 octets（如 \`00A4\` / \`FFFF\`）。
- ✅ 已修正（2026-10）：Value 以宣告的 Length 為界解析，內部欄位不足時印 \`* Error: Routing Entry Value: Payload too short: ...\`，不再讀到下一筆 entry。
- Type 欄位查表用的是 \`q_type[1:2]\`（低 nibble 字元），印出的是整個 octet 原值（例如 \`(72)\`）。
- 函式內用 \`len\` 當變數名稱，遮蔽了 Python 內建的 \`len\`（只影響這個函式的區域範圍）。

<a id="rf_discover_ntf"></a><a id="RF_DISCOVER_NTF"></a>
## RF_DISCOVER_NTF  (\`61 03\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | RF Management / 0x03 / NTF |
| Handler | [\`RF_Management.py:502\`](../../nci_decoder/nfc_forum_2_0_pkg/RF_Management.py#L502) \`RF_DISCOVER_NTF\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | RF Discovery ID | 1 | \`tbl_rf_dis_id.get(id, id)\`（見 [Tables](Tables.md#tbl_rf_dis_id)）：只有 \`00\`、\`FF\` 會顯示 \`RFU\`，其他值直接印原值 |
| 2 | RF Protocol | 1 | \`tbl_rf_proto\`（見 [Tables](Tables.md#tbl_rf_proto)） |
| 3 | RF Technology and Mode | 1 | \`tbl_rf_tech_mode\`（見 [Tables](Tables.md#tbl_rf_tech_mode)） |
| 4 | Length of RF Technology Specific Parameters | 1 (n) | 十進位 |
| 5 | RF Technology Specific Parameters | n | 交給 [\`RF_TECH_SPEC_PARA\`](#共用結構-b-rf_tech_spec_para)，依欄位 3 的 hex code 分支（見下），讀取以 n 為界 |
| 6 | Notification Type | 1 | 程式內判斷：\`00\` Last NTF、\`01\` Last NTF (due to NFCC reaching its resource limit)、\`02\` More NTF to follow，其他 \`RFU\` |

**RF Technology Specific Parameters 依 RF Technology and Mode 的格式**（完整定義見[共用結構 B](#共用結構-b-rf_tech_spec_para)）：

| RF Technology and Mode | 參數格式 |
|---|---|
| \`00\` A_PASSIVE_POLL | SENS_RES(2) + NFCID1 Len(1) + NFCID1(l) + SEL_RES Len(1) + SEL_RES(l) + HRx Len(1) + HRx(l) |
| \`01\` B_PASSIVE_POLL | SENSB_RES Len(1) + SENSB_RES(l) |
| \`02\` F_PASSIVE_POLL | Bit Rate(1) + SENSF_RES Len(1) + SENSF_RES(l) |
| \`06\` V_PASSIVE_POLL | RES_FLAG(1) + DSFID(1) + UID(8) |
| \`03\` ACTIVE_POLL | ATR_RES Len(1) + ATR_RES(n) |
| \`80\` A_PASSIVE_LISTEN | 無 |
| \`81\` B_PASSIVE_LISTEN | SENSB_REQ Command(1) |
| \`82\` F_PASSIVE_LISTEN | Local NFCID2 Len(1) + Local NFCID2(l) |
| \`83\` ACTIVE_LISTEN | ATR_REQ Len(1) + ATR_REQ(n) |
| 其他 | 整段印 \`Proprietary parameters\` |

### 範例
- NFC-A Poll（ISO-DEP）— Raw：\`61 03 12 01 04 00 0D 44 00 07 04 11 22 33 44 55 66 01 20 00 02\`

\`\`\`text
  << RF_DISCOVER_NTF >>  
  * RF Discovery ID: 01
  * RF Protocol: ISO-DEP (04)
  * Mode: A_PASSIVE_POLL (00)
  * Len of RF Tech Specific Params: 13
  * SENS_RES Response: 4400
  * NFCID1 Len: 7
  * NFCID1: 04112233445566
  * SEL_RES Rsp Len: 1
  * SEL_RES Rsp: 20
  * HRx Len: 0
  * NTF Type: More NTF to follow (02)
#end
\`\`\`

- NFC-A Poll（T1T，含 HRx）— Raw：\`61 03 11 02 01 00 0C 0C 00 04 11 22 33 44 01 00 02 11 00 02\`

\`\`\`text
  << RF_DISCOVER_NTF >>  
  * RF Discovery ID: 02
  * RF Protocol: T1T (01)
  * Mode: A_PASSIVE_POLL (00)
  * Len of RF Tech Specific Params: 12
  * SENS_RES Response: 0C00
  * NFCID1 Len: 4
  * NFCID1: 11223344
  * SEL_RES Rsp Len: 1
  * SEL_RES Rsp: 00
  * HRx Len: 2
  * HRx: 1100
  * NTF Type: More NTF to follow (02)
#end
\`\`\`

- NFC-B Poll — Raw：\`61 03 11 03 04 01 0C 0B 50 11 22 33 44 00 00 00 00 71 81 02\`

\`\`\`text
  << RF_DISCOVER_NTF >>  
  * RF Discovery ID: 03
  * RF Protocol: ISO-DEP (04)
  * Mode: B_PASSIVE_POLL (01)
  * Len of RF Tech Specific Params: 12
  * SENSB_RES Rsp Len: 11
  * SENSB_RES Rsp: 5011223344000000007181
  * NTF Type: More NTF to follow (02)
#end
\`\`\`

- NFC-F Poll — Raw：\`61 03 19 04 03 02 14 01 12 01 01 FE 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F 02\`

\`\`\`text
  << RF_DISCOVER_NTF >>  
  * RF Discovery ID: 04
  * RF Protocol: T3T (03)
  * Mode: F_PASSIVE_POLL (02)
  * Len of RF Tech Specific Params: 20
  * Bit Rate: 212 kbps
  * SENSF_RES Rsp Len: 18
  * SENSF_RES Rsp: 0101FE0102030405060708090A0B0C0D0E0F

#end
\`\`\`

- NFC-V Poll — Raw：\`61 03 0F 05 06 06 0A 00 00 E0 04 01 00 00 00 00 01 01\`

\`\`\`text
  << RF_DISCOVER_NTF >>  
  * RF Discovery ID: 05
  * RF Protocol: T5T (06)
  * Mode: V_PASSIVE_POLL (06)
  * Len of RF Tech Specific Params: 10
  * RES_FLAG: 00
  * DSFID: 00
  * UID: E004010000000001
  * NTF Type: Last NTF (due to NFCC reaching its resource limit) (01)
#end
\`\`\`

- ACTIVE_POLL — Raw：\`61 03 0A 06 05 03 05 04 D5 01 AA BB 00\`

### 實作備註
- RF Discovery ID 查詢 \`tbl_rf_dis_id.get(id, id)\` 不使用範圍鍵 \`01-FF\`，所以有效 ID 只會印出原值（例如 \`01\`）；\`00\` 會印 \`RFU\`（已實測）。
- ✅ 已修正（2026-10）：RF Protocol \`80\`、Mode \`70\` 經 \`lookup\` 範圍鍵顯示 \`For proprietary use\` / \`Reserved for Proprietary Technologies in Poll Mode\`；Specific Parameters 仍進入 \`Proprietary parameters\` 分支。
- ✅ 已修正（2026-10）：Length = 0 但 Mode 需要固定欄位時，不再丟 \`ValueError\`，改印 \`* Error: RF Technology Specific Parameters: Payload too short: need 2 byte(s) for SENS_RES Response, 0 left\` 後繼續解析 Notification Type。

| 1 | RF Discovery ID | 1 | \`tbl_rf_dis_id.get(id, id)\`（見 [Tables](Tables.md#tbl_rf_dis_id)） |
| 2 | RF Interface | 1 | \`tbl_rf_if\`（見 [Tables](Tables.md#tbl_rf_if)） |
| 3 | RF Protocol | 1 | \`tbl_rf_proto\`（見 [Tables](Tables.md#tbl_rf_proto)） |
| 4 | Activation RF Technology and Mode | 1 | \`tbl_rf_tech_mode\`（見 [Tables](Tables.md#tbl_rf_tech_mode)） |
| 5 | Max Data Packet Payload Size | 1 | 十進位 + 原值 |
| 6 | Initial Number of Credits | 1 | \`FF\` → \`Not used (FF)\`；其他以 \`int(x, 16)\` 轉十進位 |
| 7 | Length of RF Technology Specific Parameters | 1 (l) | 十進位 |
| 8 | RF Technology Specific Parameters | l | 只在 l ≠ 0 時交給 [\`RF_TECH_SPEC_PARA\`](#共用結構-b-rf_tech_spec_para)，依欄位 4 的 hex code 分支、讀取以 l 為界（格式表見 [RF_DISCOVER_NTF](#rf_discover_ntf--61-03)） |
| 9 | Data Exchange RF Technology and Mode | 1 | \`tbl_rf_tech_mode\`（見 [Tables](Tables.md#tbl_rf_tech_mode)） |
| 10 | Data Exchange Transmit Bit Rate | 1 | \`tbl_bit_rates\`（見 [Tables](Tables.md#tbl_bit_rates)） |
| 11 | Data Exchange Receive Bit Rate | 1 | \`tbl_bit_rates\`（見 [Tables](Tables.md#tbl_bit_rates)） |
| 12 | Length of Activation Parameters | 1 (n) | 十進位 |
| 13 | Activation Parameters | n | n = 0 時不讀任何內容；否則依欄位 2（RF Interface hex code）+ 欄位 4（Activation Mode hex code）分支，見下表。讀取以 n 為界：內部欄位不足印 \`* Error: Activation Parameters: Payload too short: ...\`；專屬分支解析完仍有剩餘時印 \`* Remaining Activation Params: <hex>\` |

#### Activation Parameters 分支（依 RF Interface × Activation RF Technology and Mode）

| RF Interface | Activation Mode | 規範表 | 欄位（依序） | 解析方式 |
|---|---|---|---|---|
| ISO-DEP (\`02\`) | A_PASSIVE_POLL (\`00\`) | Table 95 | RATS Response Length(1, l) + RATS Response(l) | 長度十進位 + 原值；內容印 hex |
| ISO-DEP | B_PASSIVE_POLL (\`01\`) | Table 96 | ATTRIB Response Length(1, l) + ATTRIB Response(l) | 同上 |
| ISO-DEP | A_PASSIVE_LISTEN (\`80\`) | Table 98 | RATS Command Param(1) | 印 hex |
| ISO-DEP | B_PASSIVE_LISTEN (\`81\`) | Table 99 | ATTRIB Command Length(1, l) + ATTRIB Command(l) | 長度十進位；內容印 hex |
| ISO-DEP | 其他 | — | Activation Parameters(n) | n > 0 時整段印 hex |
| NFC-DEP (\`03\`) | A_PASSIVE_POLL (\`00\`) 或 F_PASSIVE_POLL (\`02\`) | Table 102 | ATR_RES Response Length(1, l) + ATR_RES Response(l) + Data Exchange Length Reduction(1) | 長度十進位；ATR_RES 印 hex；LR 查 \`tbl_len_rdu_val\`（見 [Tables](Tables.md#tbl_len_rdu_val)），印 \`Data Exchange LR: <text> (raw)\` |
| NFC-DEP | A_PASSIVE_LISTEN (\`80\`) 或 F_PASSIVE_LISTEN (\`82\`) | Table 103 | ATR_REQ Command Length(1, l) + ATR_REQ Command(l) + Data Exchange Length Reduction(1) | 長度十進位；ATR_REQ 印 hex；LR 查 \`tbl_len_rdu_val\`（見 [Tables](Tables.md#tbl_len_rdu_val)） |
| NFC-DEP | 其他（包括 ACTIVE_POLL \`03\`、ACTIVE_LISTEN \`83\`） | — | Activation Parameters(n) | n > 0 時整段印 hex |
| 其他（NFCEE Direct \`00\`、Frame \`01\`、NDEF \`06\`、proprietary/RFU） | 任意 | — | Activation Parameters(n) | n > 0 時整段印 hex |

- ✅ 已修正（2026-10）：Initial Number of Credits 改用 \`int(x, 16)\`，\`0A\` 印 \`10\`、\`10\` 印 \`16\`（見上方範例）。
- ✅ 已修正（2026-10）：Activation Parameters 以宣告長度 n 為界：n = 0 時不讀任何內容；內部欄位超出 n 時印 \`* Error: Activation Parameters: Payload too short: ...\`；解析完仍有剩餘時印 \`* Remaining Activation Params: <hex>\`。
- ✅ 已修正（2026-10）：NFC-DEP Poll（Table 102）也在 ATR_RES 之後讀 1 octet 的 Data Exchange Length Reduction（\`tbl_len_rdu_val\`），與 Listen（Table 103）一致；資料不足時印 Error 行（見 NFC-DEP / NFC-A Poll 範例）。
- RF Technology Specific Parameters 只在 Length ≠ 0 時才呼叫 \`RF_TECH_SPEC_PARA\`，所以 A_PASSIVE_LISTEN 搭配 Length 0 時不會印 \`There is no RF Technology Specific Parameters\`（RF_DISCOVER_NTF 則會印）。
- ACTIVE_POLL / ACTIVE_LISTEN 搭配 NFC-DEP 時沒有專屬的 Activation Parameters 分支，只會印 raw。
- ✅ 已修正（2026-10）：RF Interface、RF Protocol、Mode、Bit Rate 改用 \`lookup\`，proprietary 範圍值（\`80-FE\` 等）顯示表中文字；Activation Parameters 改依 hex code 分支（proprietary interface 仍走 raw 分支）。
- RF Discovery ID 仍用 \`tbl_rf_dis_id.get(id, id)\`，\`01\`–\`FE\` 只印原值（同 RF_DISCOVER_NTF）。

<a id="rf_nfcee_action_ntf"></a><a id="RF_NFCEE_ACTION_NTF"></a>
## RF_NFCEE_ACTION_NTF  (\`61 09\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | RF Management / 0x09 / NTF |
| Handler | [\`RF_Management.py:819\`](../../nci_decoder/nfc_forum_2_0_pkg/RF_Management.py#L819) \`RF_NFCEE_ACTION_NTF\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | NFCEE ID | 1 | 印原值，再加上 \`tbl_nfcee_id\` 的精確查詢結果與 \`find_range_key\` 範圍查詢結果（見 [Tables](Tables.md#tbl_nfcee_id)） |
| 2 | Trigger | 1 | \`lookup(tbl_nfcee_ntf_trig, ...)\`（見 [Tables](Tables.md#tbl_nfcee_ntf_trig)），範圍鍵 \`06-0F\`/\`10-7F\`/\`80-FF\` 可命中；分支仍依原始 Trigger 值 |
| 3 | Supporting Data Length | 1 (n) | 十進位 |
| 4 | Supporting Data | n | 依 Trigger 解析，見下表 |

**Supporting Data 依 Trigger 的格式**

| Trigger | 意義 | Supporting Data 解析 |
|---|---|---|
| \`00\` | [ISO/IEC_7816-4] SELECT command with an AID | \`AID:\` 印 hex |
| \`01\` | Protocol-based Route Selection | 整段（應為 1 octet）查 \`tbl_rf_proto\`（見 [Tables](Tables.md#tbl_rf_proto)） |
| \`02\` | Technology-based Route Selection | 整段查 \`tbl_rf_tech\`（見 [Tables](Tables.md#tbl_rf_tech)） |
| \`03\` | System Code-based Route Selection | \`SC Route:\` 印 hex |
| \`04\` | APDU Pattern-based Route Selection | 前 \`n//2\` octets 印 \`Reference data:\`，其餘（n 為奇數時多 1 octet）印 \`Mask:\` |
| \`05\` | Forced NFCEE Routing | 整段查 \`tbl_rf_tech\` |
| \`06-0F\`、\`10-7F\`、\`80-FF\` | RFU / Application specific / RFU | n > 0 時印 \`Data: <hex>\` |

### 範例
- Trigger \`00\`（AID）— Raw：\`61 09 0A 80 00 07 A0 00 00 00 03 10 10\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 80  (HCI-NFCEE)
  * Trigger: [ISO/IEC_7816-4] SELECT command with an AID (00)
  * Supporting Data Len: 7
  * Supporting Data: 
    * AID: A0000000031010
#end
\`\`\`

- Trigger \`01\`（Protocol）— Raw：\`61 09 04 02 01 01 04\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 02  (Static IDs)
  * Trigger: Protocol-based Route Selection Process (ref to Table 133) (01)
  * Supporting Data Len: 1
  * Supporting Data: 
    * RF Protocol: ISO-DEP (04)
#end
\`\`\`

- Trigger \`02\`（Technology）— Raw：\`61 09 04 02 02 01 01\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 02  (Static IDs)
  * Trigger: Technology-based Route Selection Process (ref to Table 130) (02)
  * Supporting Data Len: 1
  * Supporting Data: 
    * RF Technology: NFC_RF_TECHNOLOGY_B (01)
#end
\`\`\`

- Trigger \`03\`（System Code）— Raw：\`61 09 05 02 03 02 40 00\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 02  (Static IDs)
  * Trigger: System Code-based Route Selection Process (03)
  * Supporting Data Len: 2
  * Supporting Data: 
    * SC Route: 4000
#end
\`\`\`

- Trigger \`04\`（APDU Pattern）— Raw：\`61 09 07 02 04 04 00 A4 FF FF\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 02  (Static IDs)
  * Trigger: TAPDU Pattern-based Route Selection Process (as defined in Table 58) (04)
  * Supporting Data Len: 4
  * Supporting Data: 
    * Reference data: 00A4
    * Mask: FFFF
#end
\`\`\`

- Trigger \`05\`（Forced NFCEE Routing）— Raw：\`61 09 04 02 05 01 00\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 02  (Static IDs)
  * Trigger: Forced NFCEE Routing is used (See Table 130) (05)
  * Supporting Data Len: 1
  * Supporting Data: 
    * RF Technology: NFC_RF_TECHNOLOGY_A (00)
#end
\`\`\`

- Trigger \`10\`（Application specific）— Raw：\`61 09 05 10 10 02 AA BB\`

\`\`\`text
  << RF_NFCEE_ACTION_NTF >>  
  * NFCEE ID: 10  (NFCEE)
  * Trigger: Application specific (10)
  * Supporting Data Len: 2
  * Supporting Data: 
    * Data: AABB
#end
\`\`\`

### 實作備註
- ✅ 已修正（2026-10）：Trigger \`04\` 以 \`(n//2)*2\` 個 hex 字元切開，前 n//2 octets 為 Reference data、其餘為 Mask，不再丟 \`TypeError\`。
- ✅ 已修正（2026-10）：Trigger 落在範圍鍵（\`06-0F\`、\`10-7F\`、\`80-FF\`）時，Supporting Data 內容（n > 0）以 \`Data: <hex>\` 印出。
- Trigger \`01\`/\`02\`/\`05\` 用整段 \`data_val\` 查表；若長度不是 1 octet 會顯示 \`RFU\`。

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Number of Information Entries | 1 (n) | 十進位 |
| 2 | Information Entry [1..n]（TLV） | x+2 | Value 以 x 為界解析，不足時印 \`* Error: Information Entry Value: Payload too short: ...\` |
| ﹂ | Type | 1 | \`lookup(tbl_nfcee_disc_req_type, ...)\`（見 [Tables](Tables.md#tbl_nfcee_disc_req_type)），範圍鍵 \`02-7F\`/\`80-FF\` 可命中；只印名稱不印原值 |
| ﹂ | Length | 1 (x) | 十進位 |
| ﹂ | Value | x | 先整段印 \`Val:\`；Type 為 \`00\`/\`01\` 時再拆解（見下） |

**Type \`00\`（Added to list）/ \`01\`（Removed from list）的 Value**

| # | 欄位 | 長度 | 解析方式 / 對照表 |
|---|---|---|---|

其他 Type 只印 \`Val:\` 原值。

### 範例
- Raw：\`61 0A 0F 03 00 03 80 00 04 01 03 10 81 04 80 02 AA BB\`

  * Number Of Info Entries: 3

   ~ [Info Entry_0] ~  
    * Type: Added to list
    * Len: 3
    * Val: 800004
      * NFCEE: 80  (HCI-NFCEE)
      * Mode: A_PASSIVE_POLL (00)
      * RF Protocol: ISO-DEP (04)

   ~ [Info Entry_1] ~  
    * Type: Removed from list
    * Len: 3
    * Val: 108104
      * NFCEE: 10  (NFCEE)
      * Mode: B_PASSIVE_LISTEN (81)
      * RF Protocol: ISO-DEP (04)

   ~ [Info Entry_2] ~  
    * Type: For proprietary use
    * Len: 2
    * Val: AABB
#end
\`\`\`

### 實作備註
- Type 欄位只印查表名稱，不附原始 hex。

## RF_PARAMETER_UPDATE_CMD  (\`21 0B\`)

| 項目 | 值 |

| GID / OID / MT | RF Management / 0x0B / CMD |
| Handler | [\`RF_Management.py:919\`](../../nci_decoder/nfc_forum_2_0_pkg/RF_Management.py#L919) \`RF_PARAMETER_UPDATE_CMD\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Number of Parameters | 1 (n) | 十進位 + 原值 |
| 2 | RF Communication Parameter [1..n]（TLV） | x+2 | |
| ﹂ | ID | 1 | \`tbl_rf_commu_para_id\`（見 [Tables](Tables.md#tbl_rf_commu_para_id)） |
| ﹂ | Length | 1 (x) | 十進位 |
| ﹂ | Value | x | 先整段印 \`Val:\`，再依 ID 解析第 1 octet（見下）；x = 0 時只印空的 \`Val:\`，不再解析 |

**Value 依 ID 的解析**

| ID | 意義 | 解析方式 |
|---|---|---|
| \`00\` | RF Technology and Mode | 第 1 octet 查 \`tbl_rf_tech_mode\`（見 [Tables](Tables.md#tbl_rf_tech_mode)） |

| \`02\` | Receive Bit Rate | 第 1 octet 查 \`tbl_bit_rates\`，標 \`Rx\` |
| \`03\` | NFC-B Data Exchange Configuration（Table 92） | 第 1 octet 拆 bit，見下表 |
| 其他 | — | 只印 \`Val:\` 原值 |

**ID \`03\` NFC-B Data Exchange Configuration bit 對應（程式內實作）**

| Bit | 欄位 |
|---|---|
| b7–b6 | Minimum TR0 |
| b5–b4 | Minimum TR1 |
| b3 | Suppression of EoS |
| b2 | Suppression of SoS |
| b1–b0 | Minimum TR3 |

### 範例
- Raw：\`21 0B 0D 04 00 01 00 01 01 02 02 01 02 03 01 E5\`

\`\`\`text
  << RF_PARAMETER_UPDATE_CMD >>  
  * Number of Params: 4 (04)

   ~ [RF Communication 0] ~  
  * Type ID: RF Technology and Mode (coded as defined in Table 131) (00)
  * Len: 1
  * Val: 00
    * Mode: A_PASSIVE_POLL (00)

   ~ [RF Communication 1] ~  
  * Type ID: Transmit Bit Rate (coded as defined in Table 132) (01)
  * Len: 1
  * Val: 02
    * Tx: 424 Kbit/s (02)

   ~ [RF Communication 2] ~  
  * Type ID: Receive Bit Rate (coded as defined in Table 132) (02)
  * Len: 1
  * Val: 02
    * Rx: 424 Kbit/s (02)

   ~ [RF Communication 3] ~  
  * Type ID: NFC-B Data Exchange Configuration (coded as defined in Table 92) (03)
  * Len: 1
  * Val: E5
    * NFC-B Data Exchange Config: E5
     ~ Minimum TR0:      11
     ~ Minimum TR1:      10
     ~ Suppression of EoS: 0
     ~ Suppression of SoS: 1
     ~ Minimum TR3:      01
#end
\`\`\`

### 實作備註
- ✅ 已修正（2026-10）：\`tbl_rf_commu_para_id['01']\`/\`['02']\` 的說明文字已改為 \`coded as defined in Table 132\`。
- ✅ 已修正（2026-10）：\`tbl_rf_commu_para_id\` 改用 \`lookup\`，\`80\`–\`FF\` 顯示 \`Proprietary\`。
- ✅ 已修正（2026-10）：Length = 0（空 Value）時只印 \`Val:\`，不再嘗試解析第 1 octet。
- 每個參數內的欄位縮排（\`  * Type ID\`）和外層相同，輸出排版上看不出巢狀層次。

<a id="rf_set_forced_nfcee_routing_cmd"></a><a id="RF_SET_FORCED_NFCEE_ROUTING_CMD"></a>
## RF_SET_FORCED_NFCEE_ROUTING_CMD  (\`21 11\`)

| 項目 | 值 |
|---|---|
| GID / OID / MT | RF Management / 0x11 / CMD |
| Handler | [\`RF_Management.py:1202\`](../../nci_decoder/nfc_forum_2_0_pkg/RF_Management.py#L1202) \`RF_SET_FORCED_NFCEE_ROUTING_CMD\` |

### Payload 格式
| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |
|---|---|---|---|
| 1 | Forced NFCEE Routing State | 1 | 程式內判斷：\`00\` Disabled、\`01\` Enabled，其他印 \`Error (xx)\` |
| 2 | Forced NFCEE Value Field | 0 或 2 | 只在 State = \`01\` 時解析 |
| ﹂ | Forced NFCEE | 1 | 原值 + \`tbl_nfcee_id\` 精確查詢 + \`find_range_key\` 範圍查詢（見 [Tables](Tables.md#tbl_nfcee_id)） |
| ﹂ | Forced Power State | 1 | 印 8-bit 二進位，再對 bit5..bit0 查 \`tbl_pwr_state\`（見 [Tables](Tables.md#tbl_pwr_state)），1 = \`Apply\`、0 = \`Not apply\`（bit 對應同[共用結構 A](#共用結構-a-listen_mode_routing_info)） |

### 範例
- Disabled — Raw：\`21 11 01 00\`

\`\`\`text
  << RF_SET_FORCED_NFCEE_ROUTING_CMD >>  
  * Forced NFCEE Routing State: Disabled
#end
\`\`\`

- Enabled — Raw：\`21 11 03 01 80 3B\`

\`\`\`text
  << RF_SET_FORCED_NFCEE_ROUTING_CMD >>  
  * Forced NFCEE Routing State: Enabled
  * Forced NFCEE: 80  (HCI-NFCEE)
    * Power State: 00111011 (3B)
     ~ Screen Off lock (Sub-State 3):Apply     
     ~ Screen On lock (Sub-State 2):Apply     
     ~ Screen off unlock (Sub-State 1):Apply     
     ~ Battery Off State:        Not apply 
     ~ Switch Off State:         Apply     
     ~ Switch On State:          Apply     
#end
\`\`\`

- 不合法的 State — Raw：\`21 11 01 02\`

\`\`\`text
  << RF_SET_FORCED_NFCEE_ROUTING_CMD >>  
  * Forced NFCEE Routing State: Error (02)
#end
\`\`\`

### 實作備註
- Power State 的欄寬是 \`'{0:<33}'\`，比 Sub-State 標籤短，所以 Sub-State 1–3 的 \`Apply\`/\`Not apply\` 會直接接在冒號後面，沒有對齊（純顯示問題，見上方範例）。\`LISTEN_MODE_ROUTING_INFO\` 則使用 \`<43\`/\`>10\`。

`,Un='# nfc_forum_2_0_pkg 對照表（Tables）\n\n本文件完整列出 `nci_decoder/nfc_forum_2_0_pkg/__table__.py` 中所有 `tbl_*` 對照表（共 34 張），以及 `Decoder_Main.py` 內的 `tbl_mt_val`、`tbl_gid_val`。內容以程式碼為準；spec Table 編號取自程式中的 `\'name\'` 欄位或註解，頁碼參考 `NCI_ref/NCI_commands_table_ref.md`（無頁碼者表示該文件未記錄）。\n\n「使用的 handler」以 grep `NFC_table.tbl_xxx` 搜尋 `nfc_forum_2_0_pkg` 下的 `NCI_Core.py`、`RF_Management.py`、`NFCEE_Management.py` 取得（已排除註解行）；若使用處位於共用 helper（`LISTEN_MODE_ROUTING_INFO`、`RF_TECH_SPEC_PARA`、`VALUE_OF_CFG_PARA`），另列出呼叫該 helper 的 handler。\n\n共通說明：\n\n- 每張表都有一個 `\'name\'` key（表的說明字串），屬於 metadata，不是可查的值，以下值表中不列出（另列於各表資訊欄）。\n- 查表大多為 `range_lookup.lookup(NFC_table.tbl_xxx, value)`：先精確 key，再找涵蓋該值的 `\'XX-YY\'` 範圍 key，皆無則 `"RFU"`，因此範圍 key 可以命中。少數呼叫端仍使用 `.get(value, <fallback>)`（例如 RF Discovery ID、NFCEE ID 的精確部分、`NFCEE_Management.py` 的 Status / NFCEE Status），此時範圍 key 只有在先呼叫 `range_lookup.find_range_key(table, int_value)` 時才會命中（各表「實作備註」逐一說明）。\n- 未以 dict 實作、只寫成 docstring 結構說明的規範表（Table 52、54~58、68~76）不在本文件範圍，其解析邏輯寫在 handler 內。被註解掉的 `tbl_rst_msg`（Table 5）不生效，亦不列入（舊版 `tbl_tlv_type`（Table 119）的註解區塊已於 2026-10 刪除）。\n\n## 總覽\n\n| # | 表名 | Spec Table | 定義位置 | 項目數（不含 `name`） | 使用的 handler |\n|---|---|---|---|---|---|\n| 1 | [`tbl_status_codes`](#tbl_status_codes) | Table 129 | [`__table__.py:8`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L8) | 27 | `CORE_RESET_RSP`, `CORE_INIT_RSP`, `CORE_SET_CONFIG_RSP`, `CORE_GET_CONFIG_RSP`, `CORE_CONN_CREATE_RSP`, `CORE_CONN_CLOSE_RSP`, `CORE_GENERIC_ERROR_NTF`, `CORE_INTERFACE_ERROR_NTF`, `CORE_SET_POWER_SUB_STATE_RSP`, `RF_DISCOVER_MAP_RSP`, `RF_SET_LISTEN_MODE_ROUTING_RSP`, `RF_GET_LISTEN_MODE_ROUTING_RSP`, `RF_DISCOVER_RSP`, `RF_DISCOVER_SELECT_RSP`, `RF_DEACTIVATE_RSP`, `RF_T3T_POLLING_RSP`, `RF_T3T_POLLING_NTF`, `RF_PARAMETER_UPDATE_RSP`, `RF_INTF_EXT_START_RSP`, `RF_INTF_EXT_STOP_RSP`, `RF_EXT_AGG_ABORT_RSP`, `RF_NDEF_ABORT_RSP`, `RF_ISO_DEP_NAK_PRESENCE_RSP`, `RF_ISO_DEP_NAK_PRESENCE_NTF`, `RF_SET_FORCED_NFCEE_ROUTING_RSP`, `NFCEE_DISCOVER_RSP`, `NFCEE_MODE_SET_ #L563) | 14 | `RF_DISCOVER_CMD`, `RF_DISCOVER_NTF`, `RF_INTF_ACTIVATED_NTF`, `RF_NFCEE_DISCOVERY_REQ_NTF`, `RF_PARAMETER_UPDATE_CMD` |\n| 31 | [`tbl_len_rdu_val`](#tbl_len_rdu_val) | Table 137 | [`__table__.py:582`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L582) | 6 | `RF_INTF_ACTIVATED_NTF` |\n| 32 | [`tbl_tlv_type`](#tbl_tlv_type) | Table 118 | [`__table__.py:599`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L599) | 7 | `NFCEE_DISCOVER_NTF` |\n| 33 | [`tbl_nfcee_disc_status`](#tbl_nfcee_disc_status) | Table 117 | [`__table__.py:611`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L611) | 4 | `NFCEE_DISCOVER_NTF` |\n| 34 | [`tbl_nfcee_status`](#tbl_nfcee_status) | Table 122 | [`__table__.py:133`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L133) | 5 | `NFCEE_STATUS_NTF` |\n\n## Decoder_Main.py 內的表：tbl_mt_val / tbl_gid_val\n\n這兩張表定義在 [`Decoder_Main.py`](../../nci_decoder/Decoder_Main.py#L10) 的 `NFC_NCI_DECODER()` 函式內（區域變數），不屬於任何 vendor package，所有 vendor 共用。用途是解析 3-byte header 的 Octet 0：先把第一個 byte 轉成 8-bit 二進位字串 `first_oct_b`，`first_oct_b[0:3]` 查 `tbl_mt_val` 得到 MT，`first_oct_b[3:4]` 為 PBF，`first_oct_b[4:]` 查 `tbl_gid_val` 得到 GID 群組名稱；之後以 `pkg.tbl_nci_ctrl[gid_val][oid][mt_val]`（`__ctrl__.py`）取得 handler 並以 `raw[6:]`（header 之後的 payload）呼叫。\n\n<a id="tbl_mt_val"></a>\n### tbl_mt_val\n\nSpec：Table 2: MT Values（p.23）。定義於 [`Decoder_Main.py:10`](../../nci_decoder/Decoder_Main.py#L10)。key 為 **3-bit 二進位字串**。查表為 `tbl_mt_val.get(first_oct_b[0:3], "RFU")`。\n\n| 值 (bin) | 對應首 byte 範圍 | 意義 |\n|---|---|---|\n| `000` | `0x00`~`0x1F` | DATA |\n| `001` | `0x20`~`0x3F` | CMD |\n| `010` | `0x40`~`0x5F` | RSP |\n| `011` | `0x60`~`0x7F` | NTF |\n\n實作備註：\n\n- MT = DATA 且 Octet 1 高 6 bits 為 0 時走 DATA packet 分支（Conn ID / Credits 由程式硬編碼解析，不使用 `tbl_conn_id`）；其餘都當作 Control packet 進行 dispatch。\n- `100`~`111` 查無時得到 `"RFU"`，接著 `tbl_nci_ctrl[...][oid]["RFU"]` 會 `KeyError`，程式印出 `<< ERROR_NOT_FOUND >>` 後重新拋出例外。\n\n<a id="tbl_gid_val"></a>\n### tbl_gid_val\n\nSpec：Table 139（程式註解 `#table 139`；p.191）。定義於 [`Decoder_Main.py:18`](../../nci_decoder/Decoder_Main.py#L18)。key 為 **4-bit 二進位字串**。查表為 `tbl_gid_val.get(first_oct_b[4:])`（**無 fallback**，查無時為 `None`）。\n\n| 值 (bin) | GID (hex) | 意義 | nfc_forum_2_0_pkg `__ctrl__.py` 是否有此群組 |\n|---|---|---|---|\n| `0000` | 0x0 | NCI Core | 有 |\n| `0001` | 0x1 | RF Management | 有 |\n| `0010` | 0x2 | NFCEE Management | 有 |\n| `0011` | 0x3 | NFCC Management | 無 |\n| `0100` | 0x4 | Test Management | 無 |\n| `1111` | 0xF | Proprietary | 無 |\n\n實作備註（vendor = `\'None\'` 實測）：\n\n- GID 為 `0x3`/`0x4`/`0xF` 時 `tbl_nci_ctrl` 沒有對應群組：例如 `23 00 00` 印出 `<< ERROR_NOT_FOUND >>` 並拋出 `KeyError: \'NFCC Management\'`；`2F 00 00` 拋出 `KeyError: \'Proprietary\'`。\n- 表中未列出的 GID（如 `0x5`）查表得 `None`，`25 00 00` 拋出 `KeyError: None`。\n\n<a id="tbl_status_codes"></a>\n## tbl_status_codes\n\n| 項目 | 值 |\n|---|---|\n| Spec Table | Table 129: Status Codes（p.182） |\n| 程式 `name` | `Table 129: Status Codes:` |\n| 定義位置 | [`__table__.py:8`](../../nci_decoder/nfc_forum_2_0_pkg/__table__.py#L8)（Global Table 區段） |\n| key 型別 | hex 字串（2 字元，或 `XX-YY` 範圍） |\n\n使用的 handler：\n\n| 檔案 | 函式 | 行號 | 經由 helper 呼叫的 handler |\n|---|---|---|---|\n| `NCI_Core.py` | `CORE_RESET_RSP` | [L30](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L30) | — |\n| `NCI_Core.py` | `CORE_INIT_RSP` | [L118](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L118) | — |\n| `NCI_Core.py` | `CORE_SET_CONFIG_RSP` | [L286](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L286) | — |\n| `NCI_Core.py` | `CORE_GET_CONFIG_RSP` | [L345](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L345) | — |\n| `NCI_Core.py` | `CORE_CONN_CREATE_RSP` | [L466](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L466) | — |\n| `NCI_Core.py` | `CORE_CONN_CLOSE_RSP` | [L513](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L513) | — |\n| `NCI_Core.py` | `CORE_GENERIC_ERROR_NTF` | [L564](../../nci_decoder/nfc_forum_2_0_pkg/NCI_Core.py#L564) | — |\n| `NCI_Core.py` | `CORE_INTERFACE_ERROR_NTF` | [L581](../../nci_decoder/nfc_foru fo_param_rsp) |\n| 0x15 | `21 15` | `41 15` | `61 15` | [WPT_START_CMD](#wpt_start_cmd) / [RSP](#wpt_start_rsp) / [NTF](#wpt_start_ntf) |\n\n所有新增 handler 都放在 `RF_Management.py`，GID = RF Management (1)。\n\n---\n\n## 1. 狀態：刻意未接上 dispatch\n\n依 repo 的 [`CLAUDE.md`](../../CLAUDE.md) 說明：\n\n- `nfc_forum_2_3_pkg` **刻意沒有註冊到** `nci_decoder/vendor_registry.py`。因此 `Decoder_Main.NFC_NCI_DECODER` 不管 vendor 傳什麼，都不會走進這個套件。`vendor="None"` 會落到預設的 `nfc_forum_2_0_pkg`，`"Nxp"` 則走 `Nxp_pkg`。\n- 原因：這個套件是「NCI 規範**版本**」的增量，不是新的**廠商**，和 `vendor_registry.py` 建模的維度（vendor）互相正交。如果硬塞進 registry，就得提前做設計決策：是新增一個 `mode`／版本軸，還是重載 vendor key？要讓它可以 dispatch，得另外做後續設計。\n- `nci_decoder/__init__.py` 仍然會把 `nfc_forum_2_3_pkg` 加進 `sys.path`，讓它**可以 import 但無法 dispatch**。另外 `NCI_Decoder.spec` 的 `hiddenimports` 是否包含此套件，與本文件無關。\n\n### 如何直接呼叫（本文範例的產生方式）\n\n```python\nimport sys\nsys.path.insert(0, "E:/Project/NCI_Decoder/NCI_Decoder/nci_decoder")\nsys.path.insert(0, "E:/Project/NCI_Decoder/NCI_Decoder/nci_decoder/nfc_forum_2_3_pkg")\nfrom nfc_forum_2_3_pkg import RF_Management\nRF_Management.RF_WLC_STATUS_NTF("0501E30132015A")   # 傳入 header 之後的 payload\n```\n\n> 關於 `__pkg_import__.tbl_import` 的疑慮：2.3 套件的三個 handler 檔都在檔頭寫了 `import nfc_forum_2_3_pkg.__table__ as NFC_table`，並把每個 handler 裡的 `NFC_table = pkg_import.tbl_import(vendor, model)` **註解掉**，所以 handler 用的是 2.3 自己的表，不會解析到 2.0 的表。檔頭仍保留 `import __pkg_import__ as pkg_import`，因此 `sys.path` 一定要包含 `nci_decoder/`。本文所有範例都以上述方式實際執行，輸出照貼。範例中的 `[return x / declared y]` 是腳本另外印出的 handler 回傳值與 header 宣告長度（hex 字元數），用來模擬 `Decoder_Main` 的 `Payload error!!` 檢查，不是 handler 本身的輸出。\n\n---\n\n## 2. 與 `nfc_forum_2_0_pkg` 的差異總表\n\n比對方式：`diff -u nfc_forum_2_0_pkg/<f>.py nfc_forum_2_3_pkg/<f>.py`。\n\n| 檔案 | diff 行數 | 摘要 |\n|---|---|---|\n| `__ctrl__.py` | 23 | import 改為 2.3 模組；新增 RF OID `12`–`15` |\n| `NCI_Core.py` | 689 | 無新增 handler；表來源、輸出格式、CORE_RESET_NTF / CORE_INIT_RSP / VALUE_OF_CFG_PARA 等有語意差異，新增 4 個設定參數 |\n| `RF_Management.py` | 1158 | 新增 9 個 handler；既有 handler 有表來源、輸出格式差異，另有數個 2.0 已修好、2.3 沒同步的 bug |\n| `NFCEE_Management.py` | 255 | 無新增 handler；表來源、range bucket 寫法、輸出格式、NDEF max size 解析不同 |\n| `__table__.py` | 598 | 新增 2 張表；15 張表值有增修；所有表的 Table 編號改成 NCI 2.3 編號 |\n\n> 方向說明：從 git 紀錄看，`nfc_forum_2_3_pkg` 最後一次修改是 `f05d612`。`nfc_forum_2_0_pkg` 之後又有 `5f5cb72`（NFCEE ID range-collapse crash 修正）、`5d073dc`、`7b7964f`（改用 `range_lookup`）等提交，2.3 都沒有同步。下表很多「差異」其實是 **2.0 已修正、2.3 仍是舊寫法**，不是 NCI 2.3 規範本身的變更。下文會在相關處標註「（2.0 已修、2.3 未同步）」。\n\n### 2.1 `__ctrl__.py` 新增的 OID\n\n| GID | OID | CMD | RSP | NTF |\n|---|---|---|---|---|\n| RF Management | `12` | `RF_REMOVAL_DETECTION_CMD` | `RF_REMOVAL_DETECTION_RSP` | `RF_REMOVAL_DETECTION_NTF` |\n| RF Management | `13` | – | – | `RF_WLC_STATUS_NTF` |\n| RF Management | `14` | `GET_WLCP_INFO_PARAM_CMD` | `GET_WLCP_INFO_PARAM_RSP` | （`# "NTF": RF_Management.GET_WLCP_INFO_PARAM_NTF` 已註解，函式也不存在） |\n| RF Management | `15` | `WPT_START_CMD` | `WPT_START_RSP` | `WPT_START_NTF` |\n\n其他變更：檔頭三行 import 從 `nfc_forum_2_0_pkg` 改成 `nfc_forum_2_3_pkg`。OID `15` 之後的註解仍寫 `# 12 ~ 63 RFU`，沒有更新。NCI Core 和 NFCEE Management 兩個 GID 沒有新增 OID。\n\n### 2.2 各 .py 新增的 handler\n\n全部在 `RF_Management.py`：\n\n| Handler | 行號 | Header |\n|---|---|---|\n| `RF_REMOVAL_DETECTION_CMD` | [L1318](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1318) | `21 12` |\n| `RF_REMOVAL_DETECTION_RSP` | [L1334](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1334) | `41 12` |\n| `RF_REMOVAL_DETECTION_NTF` | [L1349](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1349) | `61 12` |\n| `RF_WLC_STATUS_NTF` | [L1364](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1364) | `61 13` |\n| `GET_WLCP_INFO_PARAM_CMD` | [L1434](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1434) | `21 14` |\n| `GET_WLCP_INFO_PARAM_RSP` | [L1458](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1458) | `41 14` |\n| `WPT_START_CMD` | [L1500](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1500) | `21 15` |\n| `WPT_START_RSP` | [L1538](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1538) | `41 15` |\n| `WPT_START_NTF` | [L1553](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1553) | `61 15` |\n\n`NCI_Core.py`、`NFCEE_Management.py` 沒有新增函式。兩個套件的函式集合，除了上面 9 個以外完全一樣。\n\n### 2.3 全檔共通差異（適用於三個 handler 檔的所有既有 handler）\n\n| # | 項目 | 2.0 | 2.3 |\n|---|---|---|---|\n| C1 | 表來源 | 每個 handler 內呼叫 `NFC_table = pkg_import.tbl_import(vendor, model)` | 檔頭 `import nfc_forum_2_3_pkg.__table__ as NFC_table`，handler 內的 `tbl_import` 已註解。`vendor`/`model` 參數不影響查表 |\n| C2 | 查表輸出格式 | `print("...: "+tbl.get(v,"RFU"), "("+v+")")`：不論查得到與否都附 `(xx)` | `tbl.get(v, "RFU ("+v+")")`：查得到只印名稱，查不到印 `RFU (xx)` |\n| C3 | 重複結構間的空行 | 每筆 list 項目（`~ [xxx_i] ~`）前會 `print()` | 不印空行 |\n| C4 | range bucket | 用 `range_lookup.find_range_key(table, int)`，NFCEE ID 等會同時印精確值與 bucket 說明 | 手寫 `if/elif` 把值收斂成 `\'02-0F\'`/`\'10-7F\'`/`\'80-FE\'` 等 key 再查表（`5f5cb72` 之前的寫法）。檔頭沒有 `import range_lookup`（2.0 已修、2.3 未同步） |\n\n### 2.4 既有 handler 的語意差異（逐一列出）\n\n下表只列 C1–C4 以外的差異。「2.0 文件」欄連到 2.0 版文件的對應章節。\n\n#### NCI_Core.py\n\n| Handler（2.3 行號） | 差異 | 2.0 文件 |\n|---|---|---|\n| `CORE_RESET_NTF` ([L36](../../nci_decoder/nfc_forum_2_3_pkg/NCI_Core.py#L36)) | NCI Version 不查 `tbl_nci_ver`，改把高/低 nibble 當 major/minor 直接印 `X.Y (xx)`，例如 `23` 印成 `2.3 (23)` | [core_reset_ntf](../nfc_forum_2_0/NCI_Core.md#core_reset_ntf) |\n| `CORE_INIT_CMD` ([L82](../../nci_decoder/nfc_forum_2_3_pkg/NCI_Core.py#L82)) | Feature Enable 後綴從 `-- RFU` 改成 `--refer to Table 9`，仍未解析 | [core_init_cmd](../nfc_forum_2_0/NCI_Core.md#core_init_cmd) |\n| `CORE_INIT_RSP` ([L99](../../nci_decoder/nfc_forum_2_3_pkg/NCI_Core.py#L99)) | **新增** NFCC Features Octet 0 bit 5「Removal Detection in Poll Mode」（Support/Not support）。Octet 標籤從 `Octet N` 改為 `octetN`。Octet 3 多印一行 `Octet_3 is reserved for proprietary capabilities`。`HCI Network Support` 文字改為 `As defined in [ETSI_102622]`。Max Routing Table Size、Max NFC-V RF Frame Size 印 `int(hex,16)`（以 big-endian 解讀 2 octets；2.0 自 2026-10 起改為 little-endian 十進位並附 raw hex）。Max Logical Conne : Value Field for Technology-based Routing` 改成 `Table 56: Technology-based Routing Field Values`。2.0 原本註解掉的 `Table 119` dict 換成 docstring 形式的 `Table 129: Value Field for T3T Command Set Interface Supplementary Information`（PMm 8 / Number of Entries 1 / System Code 2n / IDm 8n），沒有對應的 dict。\n\n---\n\n## 3. 2.3 新增 command 詳述\n\n<a id="rf_removal_detection_cmd"></a>\n<a id="RF_REMOVAL_DETECTION_CMD"></a>\n## RF_REMOVAL_DETECTION_CMD  (`21 12`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x12 / CMD |\n| Handler | [`RF_Management.py:1318`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1318) `RF_REMOVAL_DETECTION_CMD` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | WAITING_TIME | 1 | 不解析，直接印原始 hex |\n\n### 範例\n- Raw：`21 12 01 05`\n- Decoder 輸出：\n```text\n  * WAITING_TIME: 05\n[return 2 / declared 2 ]\n```\n\n### 實作備註\n- WAITING_TIME 沒有換算成時間單位。程式註解是 `# p.207 有點看不懂文件`，表示作者尚未弄清楚規範的定義。\n\n<a id="rf_removal_detection_rsp"></a>\n<a id="RF_REMOVAL_DETECTION_RSP"></a>\n## RF_REMOVAL_DETECTION_RSP  (`41 12`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x12 / RSP |\n| Handler | [`RF_Management.py:1334`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1334) `RF_REMOVAL_DETECTION_RSP` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [2.0 Tables](../nfc_forum_2_0/Tables.md#tbl_status_codes)，2.3 值相同）。查不到印 `RFU (xx)` |\n\n### 範例\n- Raw：`41 12 01 00`\n- Decoder 輸出：\n```text\n  * Status: STATUS_OK\n[return 2 / declared 2 ]\n```\n\n<a id="rf_removal_detection_ntf"></a>\n<a id="RF_REMOVAL_DETECTION_NTF"></a>\n## RF_REMOVAL_DETECTION_NTF  (`61 12`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x12 / NTF |\n| Handler | [`RF_Management.py:1349`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1349) `RF_REMOVAL_DETECTION_NTF` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [2.0 Tables](../nfc_forum_2_0/Tables.md#tbl_status_codes)）。查不到印 `RFU (xx)` |\n\n### 範例\n- Raw：`61 12 01 00`\n- Decoder 輸出：\n```text\n  * Status: STATUS_OK\n[return 2 / declared 2 ]\n```\n\n<a id="rf_wlc_status_ntf"></a>\n<a id="RF_WLC_STATUS_NTF"></a>\n## RF_WLC_STATUS_NTF  (`61 13`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x13 / NTF |\n| Handler | [`RF_Management.py:1364`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1364) `RF_WLC_STATUS_NTF` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | WLC Status Condition | 1 | 寫死在 if/elif 中（見下表） |\n| 2 | Length of WPT duration (l₁) | 1 | 十進位長度，不印出 |\n| 3 | WPT duration | l₁（0–1） | l₁ ≠ 0 才解析：先轉 8-bit 二進位，取 `[3:]`（bit 4..0，低 5 bits）轉十進位，印 `N (xx)`，不附單位 |\n| 4 | Length of Transmit Power level (l₂) | 1 | 不印出 |\n| 5 | Transmit Power level | l₂（0–1） | l₂ ≠ 0 才解析：`int(hex,16)` 加 `%`，印 `N% (xx)` |\n| 6 | Length of Battery level (l₃) | 1 | 不印出 |\n| 7 | Battery level | l₃（0–1） | l₃ ≠ 0 才解析：`int(hex,16)` 加 `%`，印 `N% (xx)` |\n\nWLC Status Condition 對照（程式內寫死，沒有對應的 `tbl_*`）：\n\n| 值 (hex) | 意義 |\n|---|---|\n| 00 | Static WPT mode Start |\n| 01 | Negotiated WPT mode Start |\n| 02 | Communication phase start |\n| 03 | NEGO wait error |\n| 04 | NEGO wait – timer started |\n| 05 | Charging phase start |\n| 06 | Stop Pattern detected |\n| 07 | FO detected |\n| 08 | Unspecified error |\n| 09 | Remote NFC Endpoint non-responsive |\n| 0A-7F | RFU（印 `RFU (xx)`） |\n| 80-FF | Proprietary（印 `Proprietary (xx)`） |\n\n### 範例\n- Raw：`61 13 07 05 01 E3 01 32 01 5A`\n- Decoder 輸出：\n```text\n  * WLC Status Condition: Charging phase start\n  * WPT duration: 3 (E3)\n  * Tx Power level:: 50% (32)\n  * Battery level:: 90% (5A)\n[return 14 / declared 14 ]\n```\n- Raw（三個長度皆為 0）：`61 13 04 09 00 00 00`\n- Decoder 輸出：\n```text\n  * WLC Status Condition: Remote NFC Endpoint non-responsive\n[return 8 / declared 8 ]\n```\n- Raw（Proprietary 狀態）：`61 13 04 85 00 00 00`\n- Decoder 輸出：\n```text\n  * WLC Status Condition: Proprietary (85)\n[return 8 / declared 8 ]\n```\n\n### 實作備註\n- `Tx Power level::`、`Battery level::` 標籤多了一個冒號（程式字串原文）。\n- WPT duration 固定取 `zfill(8)` 後的 `[3:]`，只有長度為 1 時才是「低 5 bits」。bit 7..5 被丟棄、沒有解析，長度 > 1 時結果沒有意義。\n- 三個「Length」欄位都必須存在。payload 若在 Status 之後就結束（例如 `61 13 01 09`），`int(\'\',16)` 會丟 `ValueError`（已實測）。\n\n<a id="get_wlcp_info_param_cmd"></a>\n<a id="GET_WLCP_INFO_PARAM_CMD"></a>\n## GET_WLCP_INFO_PARAM_CMD  (`21 14`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x14 / CMD |\n| Handler | [`RF_Management.py:1434`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1434) `GET_WLCP_INFO_PARAM_CMD` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Number of Parameters (n) | 1 | 十進位 |\n| 2 | Parameter ID [0..n-1] | 1 × n | 每個 ID 查 `tbl_wlc_poll_tlv`（見 [本文件](#tbl_wlc_poll_tlv)）。查不到印 `RFU (xx)` |\n\n### 範例\n- Raw：`21 14 05 04 00 01 02 03`\n- Decoder 輸出：\n```text\n  * Number of Params: 4\n  * Param ID:\n    * ID 0: P_TX\n    * ID 1: CUR_POWER_STEP\n    * ID 2: NEXT_MIN_STEP_INC\n    * ID 3: NEXT_MIN_STEP_DEC\n[return 10 / declared 10 ]\n```\n- Raw（Proprietary / RFU ID）：`21 14 03 02 80 04`\n- Decoder 輸出：\n```text\n  * Number of Params: 2\n  * Param ID:\n    * ID 0: RFU (80)\n    * ID 1: RFU (04)\n[return 6 / declared 6 ]\n```\n\n### 實作備註\n- `tbl_wlc_poll_tlv` 的 `\'04-7F\'`、`\'80-FF\'` 是 range key，但程式直接 `.get(id)`、沒有用 `range_lookup.find_range_key`，所以 0x80–0xFF 印成 `RFU (xx)`，不是表中的 `Proprietary`（見上面第二個範例）。\n- `__ctrl__.py` OID `14` 的 `"NTF"` 被註解掉，`GET_WLCP_INFO_PARAM_NTF` 函式也不存在。\n\n<a id="get_wlcp_info_param_rsp"></a>\n<a id="GET_WLCP_INFO_PARAM_RSP"></a>\n## GET_WLCP_INFO_PARAM_RSP  (`41 14`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x14 / RSP |\n| Handler | [`RF_Management.py:1458`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1458) `GET_WLCP_INFO_PARAM_RSP` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [2.0 Tables](../nfc_forum_2_0/Tables.md#tbl_status_codes)） |\n| 2 | Number of Parameters (n) | 1 | 十進位 |\n| 3 | Parameter [1..n] | (m+2) × n | TLV，每筆印 `~ [Param_i] ~` |\n| ﹂ | ID (Type) | 1 | `tbl_wlc_poll_tlv`（見 [本文件](#tbl_wlc_poll_tlv)）。查不到印 `RFU (xx)` |\n| ﹂ | Len (m) | 1 | 十進位 |\n| ﹂ | Val | m | m ≠ 0 才印原始 hex，不依 ID 解析 |\n\n### 範例\n- Raw：`41 14 08 00 02 00 01 05 01 01 32`\n- Decoder 輸出：\n```text\n  * Status: STATUS_OK\n  * Number of Params: 2\n   ~ [Param_0] ~  \n    * ID: P_TX\n    * Len: 1\n    * Val: 05\n   ~ [Param_1] ~  \n    * ID: CUR_POWER_STEP\n    * Len: 1\n    * Val: 32\n[return 16 / declared 16 ]\n```\n- Raw（失敗、無參數）：`41 14 02 03 00`\n- Decoder 輸出：\n```text\n  * Status: STATUS_FAILED\n  * Number of Params: 0\n[return 4 / declared 4 ]\n```\n\n### 實作備註\n- Val 一律印原始 hex，P_TX、CUR_POWER_STEP 等都沒有換算。\n- 0x80–0xFF 的 ID 同樣印成 `RFU (xx)`，原因同 GET_WLCP_INFO_PARAM_CMD。\n\n<a id="wpt_start_cmd"></a>\n<a id="WPT_START_CMD"></a>\n## WPT_START_CMD  (`21 15`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x15 / CMD |\n| Handler | [`RF_Management.py:1500`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1500) `WPT_START_CMD` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Number of Parameters (n) | 1 | 十進位 |\n| 2 | Parameter [1..n] | (m+2) × n | TLV，每筆印 `~ [Param_i] ~` |\n| ﹂ | ID (Type) | 1 | `tbl_wpt_start_cmd_tlv`（見 [本文件](#tbl_wpt_start_cmd_tlv)）。查不到印 `RFU (xx)` |\n| ﹂ | Len (m) | 1 | 十進位 |\n| ﹂ | Val | m | m ≠ 0 才印原始 hex |\n\n### 範例\n- Raw：`21 15 07 02 00 01 01 01 01 14`\n- Decoder 輸出：\n```text\n  * Number of Params: 2\n   ~ [Param_0] ~  \n    * ID: POWER_ADJ_REQ\n    * Len: 1\n    * Val: 01\n   ~ [Param_1] ~  \n    * ID: WPT_TIME_INT\n    * Len: 1\n    * Val: 14\n[return 14 / declared 14 ]\n```\n- Raw（Proprietary ID）：`21 15 04 01 81 01 AA`\n- Decoder 輸出：\n```text\n  * Number of Params: 1\n   ~ [Param_0] ~  \n    * ID: RFU (81)\n    * Len: 1\n    * Val: AA\n[return 8 / declared 8 ]\n```\n\n### 實作備註\n- POWER_ADJ_REQ、WPT_TIME_INT 的 Val 沒有解析。\n- `\'02-7F\'`/`\'80-FF\'` range key 沒有用 `find_range_key` 處理，0x80–0xFF 印成 `RFU (xx)`。\n\n<a id="wpt_start_rsp"></a>\n<a id="WPT_START_RSP"></a>\n## WPT_START_RSP  (`41 15`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x15 / RSP |\n| Handler | [`RF_Management.py:1538`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1538) `WPT_START_RSP` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [2.0 Tables](../nfc_forum_2_0/Tables.md#tbl_status_codes)） |\n\n### 範例\n- Raw：`41 15 01 00`\n- Decoder 輸出：\n```text\n  * Status: STATUS_OK\n[return 2 / declared 2 ]\n```\n\n<a id="wpt_start_ntf"></a>\n<a id="WPT_START_NTF"></a>\n## WPT_START_NTF  (`61 15`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | RF Management / 0x15 / NTF |\n| Handler | [`RF_Management.py:1553`](../../nci_decoder/nfc_forum_2_3_pkg/RF_Management.py#L1553) `WPT_START_NTF` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | WPT End Condition | 1 | 寫死在 if/elif 中（見下表） |\n\n| 值 (hex) | 意義 |\n|---|---|\n| 00 | Time completed |\n| 01 | FOD |\n| 02 | Stop Pattern |\n| 03 | Unspecified error |\n| 04-7F | RFU（印 `RFU (xx)`） |\n| 80-FF | Proprietary（印 `Proprietary (xx)`） |\n\n### 範例\n- Raw：`61 15 01 00`\n- Decoder 輸出：\n```text\n  * WLC Status Condition: Time completed\n[return 2 / declared 2 ]\n```\n- Raw：`61 15 01 85`\n- Decoder 輸出：\n```text\n  * WLC Status Condition: Proprietary (85)\n[return 2 / declared 2 ]\n```\n\n### 實作備註\n- docstring 的欄位名稱是 `WPT End Condition`，但輸出標籤寫成 `WLC Status Condition`（沿用 RF_WLC_STATUS_NTF 的字串）。\n\n---\n\n## 4. 修改過的既有 handler：新增功能的實測輸出\n\n以下輸出用來佐證第 2.4 節描述的 2.3 新行為（同樣以直接 import 方式執行）。\n\n`CORE_RESET_NTF`：NCI Version 改用 nibble 解析\n```text\n### raw=60 00 05 02 01 23 00 00\n  * Rest Trigger: CORE_RESET_CMD\n  * Config Status: Reset Config\n  * NCI Version: 2.3 (23)\n  * Manufacturer ID: Info is not available.\n  * Manufacturer Specific Info: \n[return 10 / declared 10 ]\n```\n\n`CORE_INIT_RSP`：新增 Removal Detection bit；Max Routing Table Size 以 big-endian 轉十進位（`FF 00` 印成 65280）\n```text\n### raw=40 00 10 00 20 00 00 00 01 FF 00 FF 01 01 00 01 01 02 00\n  * Status: STATUS_OK\n  * NFCC Features: 20000000\n    * octet0: 00100000\n     ~ Removal Detection in Poll Mode:  Support\n     ~ Active Communication Mode:       Not support\n     ~ HCI Network Support:             Not implement\n     ~ Discovery Cfg Mode:              The DH is the only entity that configs the NFCC.\n     ~ Discovery Freq Cfg:              Ignored in RF_DISCOVER_CMD\n    * octet1: 00000000\n     ~ Forced NFCEE routing:            Not support\n     ~ APDU Pattern based routing:      Not support\n     ~ System Code based routing:       Not support\n     ~ AID based routing:               Not support\n     ~ Protocol based routing:          Not support\n     ~ Technology based routing:        Not support\n    * octet2: 00000000\n     ~ RF Cfg in Switched Off State:    Not support\n     ~ Switched On Substates:           Not support\n     ~ Switched Off State:              Not support\n     ~ Battery Off State:               Not support\n    * octet3: 00000000\n     ~ Octet_3 is reserved for proprietary capabilities\n  * Max Logical Connections: 1\n  * Max Routing Table Size: 65280\n  * Max Control Packet Payload Size: 255\n  * Max Data Packet Payload Size of the Static HCI Connection: 1\n  * Number of Credits of the Static HCI Connection: 1\n  * Max NFC-V RF Frame Size: 1\n  * Number of Supported RF Interfaces: 1\n  * Supported RF Interface: 0200\n   ~ [RF_IF_0] ~  \n    * Interface: ISO-DEP\n    * Number of Extensions: 0\n[return 32 / declared 32 ]\n```\n\n`CORE_SET_CONFIG_CMD`：新增的 WLC 設定參數\n```text\n### raw=20 02 0D 04 86 01 01 69 01 0A 6A 01 14 6B 01 1F\n  * Number of Params: 4\n   ~ [Param_0] ~  \n    * ID: RF_WLC_STATUS_CONFIG\n    * Len: 1\n    * Val: 01\n     ~ The NFCC is allowed to send RF_WLC_STATUS_NTF Notifications to the DH.\n   ~ [Param_1] ~  \n    * ID: WLC-P_CAP_POWER_CLASS\n    * Len: 1\n    * Val: 00001010 (0A)\n   ~ [Param_2] ~  \n    * ID: TOT_POWER_STEPS\n    * Len: 1\n    * Val: 20 step (14)\n   ~ [Param_3] ~  \n    * ID: WLC_AUTO_CAPABILITIES\n    * Len: 1\n    * Val: 31 step (1F)\n     ~ NFCC as Wireless Charging Poller supports the WLC protocol for T5T.\n     ~ NFCC as Wireless Charging Poller supports the WLC protocol for T4BT.\n     ~ NFCC as Wireless Charging Poller supports the WLC protocol for T4AT.\n     ~ NFCC as Wireless Charging Poller supports the WLC protocol for T3T.\n     ~ NFCC as Wireless Charging Poller supports the WLC protocol for T2T.\n[return 26 / declared 26 ]\n```\n備註：`6B` WLC_AUTO_CAPABILITIES 是 bit field，但程式仍印 `31 step`（沿用 `6A` 的字串）。`69` 只印出二進位，沒有逐 bit 解釋。\n\n`RF_DEACTIVATE_NTF`：2.3 新的 Deactivation Reason\n```text\n### raw=61 06 02 03 05\n  * Deactivation Type: Discovery\n  * Deactivation Reason: RF_REMOTE_ENDPOINT_REMOVED\n[return 4 / declared 4 ]\n```\n\n先前實測會丟例外的既有 handler（詳見 2.4 節），已於 2026-10 全數修正：\n\n- ✅ 已修正（2026-10）：`RF_SET_LISTEN_MODE_ROUTING_CMD`（SC-based / APDU-based entry，`21 01 08 00 01 03 04 01 3B FE FE` 原本 → `TypeError`）：`(x-2)/2` 改為整數除法。\n- ✅ 已修正（2026-10）：`RF_SET_FORCED_NFCEE_ROUTING_CMD`（`21 11 03 01 80 3B` 原本 → `UnboundLocalError \'val_payload\'`）：改為前進 `p_payload`。\n- ✅ 已修正（2026-10）：`RF_DISCOVER_NTF` / `RF_INTF_ACTIVATED_NTF` 經 `RF_TECH_SPEC_PARA`（F_PASSIVE_LISTEN / ACTIVE_POLL / ACTIVE_LISTEN，`61 03 06 01 03 82 01 00 02` 原本 → `UnboundLocalError \'p_payload\'`）：改用 `para_payload`。\n- ✅ 已修正（2026-10）：`RF_NFCEE_ACTION_NTF` Trigger `04`（原本 `n/2` float 切片 → `TypeError`）：改以 `2*(n//2)` 切開 Reference data / Mask。\n\n以上只修正了會丟例外的問題；套件**仍未接上 dispatch**（見第 1 節），2.0 在本輪的其他修正（範圍 key 查表、以宣告長度為界解析等）也尚未同步到 2.3。\n\n---\n\n## 5. 2.3 新增／修改的對照表\n\n標註欄：**新增**＝2.0 沒有此值；**修改**＝值相同但文字改變（括號內是 2.0 原文）；**移除**＝2.0 有、2.3 沒有的 key。\n\n<a id="tbl_wlc_poll_tlv"></a>\n## tbl_wlc_poll_tlv\n\n**新增表**。NCI 2.3 Table 121：TLV Coding for WLC Poll Parameter I
