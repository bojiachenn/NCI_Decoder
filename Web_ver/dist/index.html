ed | 修改（`Removed from list`） |\n| 02-7F | RFU | |\n| 80-FF | For proprietary use | |\n\n<a id="tbl_nfcee_ntf_trig"></a>\n## tbl_nfcee_ntf_trig\n\nTable 88: Trigger in NFCEE Action Notification。使用者：`RF_NFCEE_ACTION_NTF`。\n\n| 值 (hex) | 意義 | 標註 |\n|---|---|---|\n| 00 | [ISO/IEC_7816-4] SELECT command with an AID | |\n| 01 | Protocol-based route selection process (ref to Table 144) | 修改（`Protocol-based Route Selection Process (ref to Table 133)`） |\n| 02 | Technology-based route selection process (ref to Table 141) | 修改（`Technology-based Route Selection Process (ref to Table 130)`） |\n| 03 | System Code-based route selection process | 修改（`System Code-based Route Selection Process`） |\n| 04 | TAPDU Pattern-based route selection process (as defined in Table 60) | 修改（`TAPDU Pattern-based Route Selection Process (as defined in Table 58)`） |\n| 05 | Forced NFCEE Routing is used (See Table 141) | 修改（`Forced NFCEE Routing is used (See Table 130)`） |\n| 06-0F | RFU | |\n| 10-7F | Application specific | |\n| 80-FF | RFU | |\n\n<a id="tbl_rf_commu_para_id"></a>\n## tbl_rf_commu_para_id\n\nTable 93: TLV Coding for RF Communication Parameter ID（2.0 為 Table 91）。使用者：`RF_PARAMETER_UPDATE_CMD`、`RF_PARAMETER_UPDATE_RSP`。\n\n| 值 (hex) | 意義 | 標註 |\n|---|---|---|\n| 00 | RF Technology and Mode (coded as defined in Table 142) | 修改（`... Table 131)`） |\n| 01 | Transmit Bit Rate (coded as defined in Table 143) | 修改（`... Table 132)`） |\n| 02 | Receive Bit Rate (coded as defined in Table 143) | 修改（`... Table 131)`，2.0 原本就引用錯表） |\n| 03 | NFC-B Data Exchange Configuration (coded as defined in Table 94) | 修改（`... Table 92)`） |\n| 80-FF | Proprietary | |\n\n<a id="tbl_tlv_type"></a>\n## tbl_tlv_type\n\nTable 128: TLV Coding for NFCEE Discovery（2.0 為 Table 118）。使用者：`NFCEE_DISCOVER_NTF`。\n\n| 值 (hex) | 意義 | 標註 |\n|---|---|---|\n| 00 | Hardware / Registration Identification (len = n) | 修改（`Hardware / Registration Identification`） |\n| 01 | ATR Bytes (len = n) | 修改（`ATR Bytes`） |\n| 02 | T3T Command Set Interface Supplementary Information (len = 9~169) | 修改（`T3T Command Set Interface Supplementary Information`） |\n| 03 | Host ID in the HCI Network (len = 1) | 修改（`Host ID in the HCI Network`） |\n| 04 | Support NDEF storage (len = 6) | 修改（`NDEF`） |\n| 05-9F | RFU | |\n| A0-FF | For proprietary use | |\n',Gn="# NXP HDLL（Host Data Link Layer）\n\nNXP SN2x0 在下載模式（bootloader / firmware download）下使用的 HDLL 協定，與 NCI 封包格式不同：沒有 MT/GID/OID，而是「2 bytes header + Op Code + Payload + 2 bytes CRC-16」。本工具只在 vendor = `'Nxp'` 時能解析 HDLL；解析入口為 [`Nxp_pkg/__ctrl__.py:117`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L117) `HDLL()`，各 op code 的 handler 定義於 [`Nxp_pkg/HDLL.py`](../../nci_decoder/Nxp_pkg/HDLL.py)，op code 對照表為 [`__ctrl__.py:90`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L90) 的 `tbl_nci_ctrl[\"HDLL\"]`。\n\n## 總覽\n\nHDLL 沒有 GID/OID，下表的「Op Code」即 frame 的第 3 個 byte。CMD 與 RSP 共用同一張 `tbl_nci_ctrl[\"HDLL\"]`，只靠 op code 值區分。\n\n### CMD Op Codes\n\n| Op Code | 類型 | Handler | 說明 |\n|---|---|---|---|\n| `F0` | CMD | [`DL_RESET`](#dl_reset--f0) | 重置 |\n| `F1` | CMD | [`DL_GET_VERSION`](#dl_get_version--f1) | 讀取版本 |\n| `F2` | CMD | [`DL_GET_SESSION_STATE`](#dl_get_session_state--f2) | 讀取 session 狀態 |\n| `F4` | CMD | [`DL_GET_DIE_ID`](#dl_get_die_id--f4) | 讀取 Die ID |\n| `E0` | CMD | [`DL_CHECK_INTEGRITY`](#dl_check_integrity--e0) | flash 完整性檢查 |\n| `C0` | CMD | [`DL_SEC_WRITE`](#dl_sec_write--c0) | 安全寫入（韌體下載） |\n| `C1` | CMD | [`DL_CERT_FRAME`](#dl_cert_frame--c1) | 憑證 frame |\n\n### RSP Op Codes（狀態碼）\n\n| Op Code | 類型 | Handler | 說明 |\n|---|---|---|---|\n| `00` | RSP | [`DL_OK`](#dl_ok--00) | 成功；payload 格式依前一個 op code 決定 |\n| `01` | RSP | [`EDL_INVALID_ADDR`](#錯誤--狀態-rsp01--31) | |\n| `02` | RSP | [`EDL_GENERIC_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `0B` | RSP | [`EDL_UNKNOW_CMD`](#錯誤--狀態-rsp01--31) | |\n| `0C` | RSP | [`EDL_ABORTED_CMD`](#錯誤--狀態-rsp01--31) | |\n| `1E` | RSP | [`EDL_ADDR_RANGE_OFL_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `1F` | RSP | [`EDL_BUFFER_OFL_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `20` | RSP | [`EDL_MEM_BSY`](#錯誤--狀態-rsp01--31) | |\n| `21` | RSP | [`EDL_SIGNATURE_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `24` | RSP | [`EDL_FIRMWARE_VERSION_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `28` | RSP | [`EDL_PROTOCOL_ERROR`](#錯誤--狀態-rsp01--31) | |\n| `2D` | RSP | [`PH_STATUS_DL_FIRST_CHUNK`](#錯誤--狀態-rsp01--31) | |\n| `2E` | RSP | [`PH_STATUS_DL_NEXT_CHUNK`](#錯誤--狀態-rsp01--31) | |\n| `31` | RSP | [`PH_STATUS_EDL_CERT_ERROR`](#錯誤--狀態-rsp01--31) | |\n\n## 判斷是否走 HDLL（`Decoder_Main.py`）\n\n[`Decoder_Main.py:44`](../../nci_decoder/Decoder_Main.py#L44) 先嘗試 NCI：若 `raw[4:6]`（第 3 byte）的值 == 封包總長度 − 3，就當成 NCI 封包解析。**只有在 NCI 長度檢查失敗時**，才檢查 [`Decoder_Main.py:106`](../../nci_decoder/Decoder_Main.py#L106)：\n\n```python\nint(first_oct_b[3:] + bin(int(raw[2:4],16))[2::].zfill(8), 2) == int(len)-4   # 2 Bytes header (HDLL) + CRC16 (2 Bytes)\n```\n\n也就是「byte0 低 5 bits ‖ byte1」組成的 13-bit frame length == 總長度 − 4（2 bytes header + 2 bytes CRC）。成立則呼叫 `pkg.HDLL(raw, mode)`；兩者都不成立印 `Error: Unknown raw data!`。\n\n## Frame 格式\n\n```\n| Byte0          | Byte1         | Byte2   | Byte3 .. Byte(N)       | CRC (2)     |\n| b7 b6 b5 b4..0 | b7..0         | Op Code | Payload (FrameLen - 1) | CRC16 MSB/LSB |\n|  -  -  C  Len[12:8] | Len[7:0] |         |                        |             |\n```\n\n| # | 欄位 | 長度 (Octets) | 解析方式 |\n|---|---|---|---|\n| 1 | Header byte0 | 1 | bit 7–6：程式未使用；bit 5：Chunk bit（`first_oct_b[2:3]`，為 1 時印 `* Chunk: 1`）；bit 4–0：Frame Length 高 5 bits |\n| 2 | Header byte1 | 1 | Frame Length 低 8 bits。Frame Length（13 bits）= Op Code + Payload 的 byte 數，**不含** header 與 CRC |\n| 3 | Op Code | 1 | `tbl_nci_ctrl[\"HDLL\"].get(op_code)` 取得 handler；找不到時標題印 `UNKNOWN (XX)`，並印 `Error: unknown HDLL op code XX, raw: <整串 raw>` |\n| 4 | Payload | Frame Length − 1 | 交給 handler：`handler(frame_len, msg, HDLL_CMD)`，`msg` 為 op code 之後的 payload hex 字串 |\n| 5 | CRC | 2 | 印 `* CRC: XXXX (CRC-16-CCITT-FALSE)`，並以 `HDLL.crc16_ccitt_false()` 對 header + op code + payload 重新計算；不一致時多印 `    ! CRC mismatch: calculated YYYY` |\n\nCRC-16-CCITT-FALSE：poly `0x1021`、init `0xFFFF`、不反射、xorout `0x0000`，計算範圍為 header + op code + payload，結果以 big-endian 放在 frame 尾端。本文件範例的 CRC 皆以此演算法計算（`00 04 F1 00 00 00` → `6E EF`，與 NXP 常見的 DL_GET_VERSION frame 一致）。\n\n### `HDLL()` 處理流程（[`__ctrl__.py:117`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L117)）\n\n1. 由 byte0/byte1 算出 `frame_len`，取 op code、`msg`（payload）。\n2. 印 `  << Nxp HDLL: <handler 名> >>  `；`mode == 1` 時同一行接著印整串 raw，`mode == 2` 只換行。\n3. 若 `chunk == '1'`（byte0 bit 5 = 1）印 `* Chunk: 1`。\n4. 若 op code 有對應 handler，呼叫 `handler(frame_len, msg, HDLL_CMD)`，回傳 `check`（handler 走過的 hex 字元數）；否則印 `Error: unknown HDLL op code XX, raw: <raw>`，`check = None`。標題中的 handler 名稱在找不到時為 `UNKNOWN (XX)`。\n5. `HDLL_CMD = op_code`：把**這一個** frame 的 op code 存入模組全域變數（初始值 [`__ctrl__.py:7`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L7) `HDLL_CMD = '00'`）。\n6. 印 CRC，並以 CRC-16-CCITT-FALSE 驗證；不一致時印 `    ! CRC mismatch: calculated YYYY`。\n7. 長度檢查（僅 `check` 不為 `None` 時）：`hdll_payload != len(raw)` 或 `check + 2 != frame_len * 2` 時印 `Error: Payload error!!` 及 `check` / `Packet Len` / `Frame Len`。`check + 2` 的 `+2` 是補上 op code 的 1 byte，因此 handler 必須剛好走完 `Frame Length − 1` bytes。\n8. 印 `#end`。\n\n### RSP 如何依前一個 CMD 決定格式\n\nHDLL RSP 本身不帶「回應哪個 CMD」的資訊，因此 `HDLL()` 用全域變數 `HDLL_CMD` 記住**上一個被解析的 frame 的 op code**，作為第三個參數 `pre_op` 傳給 handler。只有 `DL_OK`（`00`）會使用 `pre_op`：\n\n| `pre_op` | `DL_OK` payload 格式 |\n|---|---|\n| `F1` | DL_GET_VERSION 回應（見 [DL_OK](#dl_ok--00)） |\n| `F2` | Session State |\n| `F4` | Die ID |\n| `E0` | Flash integrity 結果 |\n| 其他（含 `F0`、`C0`、`C1`、`00`、錯誤碼等） | 固定 3 bytes，不解析 |\n\n注意 `HDLL_CMD` 在每個 frame 後都會更新（包括 RSP），因此 log 必須依序、逐行送進同一個 Python process 才能正確配對；第二個連續的 `DL_OK` 會拿到 `pre_op = '00'`（見 DL_OK 範例 3）。\n\n---\n\n<a id=\"dl_reset\"></a><a id=\"DL_RESET\"></a>\n## DL_RESET  (`F0`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `F0` / CMD |\n| Handler | [`HDLL.py:14`](../../nci_decoder/Nxp_pkg/HDLL.py#L14) `DL_RESET` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留 / 填 0） | 3 | 不解析，直接跳過（Frame Length = 4） |\n\n### 範例\n- Raw：`00 04 F0 00 00 00 18 5B`\n\n```text\n  << Nxp HDLL: DL_RESET >>  \n  * HDLL CMD: DL_RESET\n  * CRC: 185B (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例：Frame Length = 1（無 3 bytes padding）時的長度錯誤：\n- Raw：`00 01 F0 10 B2`\n\n```text\n  << Nxp HDLL: DL_RESET >>  \n  * HDLL CMD: DL_RESET\n  * CRC: 10B2 (CRC-16-CCITT-FALSE)\n\nError: Payload error!!\n  check: 3 Octet(s)\n  Packet Len: 5.0 Octet(s)\n  Frame Len: 1 Octet(s)\n#end\n```\n\n\n<a id=\"dl_get_version\"></a><a id=\"DL_GET_VERSION\"></a>\n## DL_GET_VERSION  (`F1`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `F1` / CMD |\n| Handler | [`HDLL.py:22`](../../nci_decoder/Nxp_pkg/HDLL.py#L22) `DL_GET_VERSION` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留 / 填 0） | 3 | 不解析，直接跳過 |\n\n### 範例\n- Raw：`00 04 F1 00 00 00 6E EF`\n\n```text\n  << Nxp HDLL: DL_GET_VERSION >>  \n  * HDLL CMD: DL_GET_VERSION\n  * CRC: 6EEF (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n設定 Chunk bit（byte0 = `0x20`）的同一個 CMD——輸出多一行 `* Chunk: 1`：\n- Raw：`20 04 F1 00 00 00 5B E7`\n\n```text\n  << Nxp HDLL: DL_GET_VERSION >>  \n  * Chunk: 1\n  * HDLL CMD: DL_GET_VERSION\n  * CRC: 5BE7 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n<a id=\"dl_get_session_state\"></a><a id=\"DL_GET_SESSION_STATE\"></a>\n## DL_GET_SESSION_STATE  (`F2`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `F2` / CMD |\n| Handler | [`HDLL.py:30`](../../nci_decoder/Nxp_pkg/HDLL.py#L30) `DL_GET_SESSION_STATE` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留 / 填 0） | 3 | 不解析，直接跳過 |\n\n### 範例\n- Raw：`00 04 F2 00 00 00 F5 33`\n\n```text\n  << Nxp HDLL: DL_GET_SESSION_STATE >>  \n  * HDLL CMD: DL_GET_SESSION_STATE\n  * CRC: F533 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n<a id=\"dl_get_die_id\"></a><a id=\"DL_GET_DIE_ID\"></a>\n## DL_GET_DIE_ID  (`F4`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `F4` / CMD |\n| Handler | [`HDLL.py:38`](../../nci_decoder/Nxp_pkg/HDLL.py#L38) `DL_GET_DIE_ID` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留 / 填 0） | 3 | 不解析，直接跳過 |\n\n### 範例\n- Raw：`00 04 F4 00 00 00 D2 AA`\n\n```text\n  << Nxp HDLL: DL_GET_DIE_ID >>  \n  * HDLL CMD: DL_GET_DIE_ID\n  * CRC: D2AA (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n<a id=\"dl_check_integrity\"></a><a id=\"DL_CHECK_INTEGRITY\"></a>\n## DL_CHECK_INTEGRITY  (`E0`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `E0` / CMD |\n| Handler | [`HDLL.py:46`](../../nci_decoder/Nxp_pkg/HDLL.py#L46) `DL_CHECK_INTEGRITY` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留 / 填 0） | 3 | 不解析，直接跳過 |\n\n### 範例\n- Raw：`00 04 E0 00 00 00 03 FC`\n\n```text\n  << Nxp HDLL: DL_CHECK_INTEGRITY >>  \n  * HDLL CMD: DL_CHECK_INTEGRITY\n  * CRC: 03FC (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n<a id=\"dl_sec_write\"></a><a id=\"DL_SEC_WRITE\"></a>\n## DL_SEC_WRITE  (`C0`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `C0` / CMD |\n| Handler | [`HDLL.py:54`](../../nci_decoder/Nxp_pkg/HDLL.py#L54) `DL_SEC_WRITE` |\n\n依 `len`（= Frame Length）分兩種格式：\n\n### Payload 格式 — First frame（`len == 502`）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （未命名） | 1 | 跳過，不印 |\n| 2 | FW version | 2 | raw hex |\n| 3 | NONCE | 16 | raw hex |\n| 4 | DIEID | 16 | raw hex |\n| 5 | CHIPMASK | 2 | raw hex |\n| 6 | MASKEDKEY | 16 | raw hex |\n| 7 | UDFSEED | 32 | raw hex |\n| 8 | HASH | 32 | raw hex |\n| 9 | SIGN | 384 | raw hex |\n\n合計 501 bytes + op code = Frame Length 502。\n\n### Payload 格式 — Middle / Last frame（`len != 502`）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Data size | 2 | big-endian 整數 `N`，不印 |\n| 2 | ADDR | 3 | raw hex |\n| 3 | DATA | N | raw hex |\n| 4 | HASH | 32 | **僅 Middle**：當 `(len-1)*2 > p_payload`（DATA 之後還有剩餘 bytes）時才讀 32 bytes HASH；否則視為 Last frame，沒有 HASH |\n\n### 範例\nFirst frame（Chunk bit = 1，Frame Length = 0x1F6 = 502；欄位內容為測試用填充值）：\n- Raw（506 bytes）：\n\n```text\n21F6C000010311111111111111111111111111111111222222222222222222222222222222220F0F3333333333333333333333333333333344444444444444444444444444444444444444444444444444444444444444445555555555555555555555555555555555555555555555555555555555555555ABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABAB74E3\n```\n\n```text\n  << Nxp HDLL: DL_SEC_WRITE >>  \n  * Chunk: 1\n  * HDLL CMD: DL_SEC_WRITE\n  * FW version: 0103\n  * NONCE: 11111111111111111111111111111111\n  * DIEID: 22222222222222222222222222222222\n  * CHIPMASK: 0F0F\n  * MASKEDKEY: 33333333333333333333333333333333\n  * UDFSEED: 4444444444444444444444444444444444444444444444444444444444444444\n  * HASH: 5555555555555555555555555555555555555555555555555555555555555555\n  * SIGN: ABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABABAB\n  * CRC: 74E3 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\nMiddle frame（Data size = 4，帶 HASH）：\n- Raw：`20 2A C0 00 04 01 20 00 DE AD BE EF 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 66 1C 2E`\n\n```text\n  << Nxp HDLL: DL_SEC_WRITE >>  \n  * Chunk: 1\n  * HDLL CMD: DL_SEC_WRITE\n  * ADDR: 012000\n  * DATA: DEADBEEF\n  * HASH: 6666666666666666666666666666666666666666666666666666666666666666\n  * CRC: 1C2E (CRC-16-CCITT-FALSE)\n#end\n```\n\n\nLast frame（Data size = 4，無 HASH）：\n- Raw：`00 0A C0 00 04 01 20 04 CA FE BA BE 8F 67`\n\n```text\n  << Nxp HDLL: DL_SEC_WRITE >>  \n  * HDLL CMD: DL_SEC_WRITE\n  * ADDR: 012004\n  * DATA: CAFEBABE\n  * CRC: 8F67 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n### 實作備註\n- First / Middle / Last 的判斷完全依 Frame Length：只要 Frame Length 恰為 502 就當 First frame，不看 chunk bit 或內容。\n- First frame 第 1 個 byte 被跳過且不印。\n\n<a id=\"dl_cert_frame\"></a><a id=\"DL_CERT_FRAME\"></a>\n## DL_CERT_FRAME  (`C1`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `C1` / CMD |\n| Handler | [`HDLL.py:102`](../../nci_decoder/Nxp_pkg/HDLL.py#L102) `DL_CERT_FRAME` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （未命名） | 1 | 跳過，不印 |\n| 2 | Chip version | 2 | raw hex |\n| 3 | Chip Life Cycle | 2 | raw hex |\n| 4 | Certificate version | 2 | raw hex |\n| 5 | PK_MOD | 384 | raw hex |\n| 6 | PK_EXP | 8 | raw hex |\n| 7 | PK_CRC | 4 | raw hex |\n| 8 | SIGN | 384 | raw hex |\n\n合計 787 bytes + op code = Frame Length 788（0x314）。\n\n### 範例\n（欄位內容為測試用填充值）\n- Raw（792 bytes）：\n\n```text\n0314C1003300C5A001007777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777 777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777\n  * PK_EXP: 0000000000010001\n  * PK_CRC: 12345678\n  * SIGN: 888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888\n  * CRC: 342E (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n### 實作備註\n- 第 1 個 byte 被跳過且不印。\n- 格式固定，未依長度分支；Frame Length 不是 788 時會出現 `Payload error!!`。\n\n---\n\n<a id=\"dl_ok\"></a><a id=\"DL_OK\"></a>\n## DL_OK  (`00`)\n\n| 項目 | 值 |\n|---|---|\n| Op Code / 類型 | `00` / RSP（DL_STATUS_OK） |\n| Handler | [`HDLL.py:130`](../../nci_decoder/Nxp_pkg/HDLL.py#L130) `DL_OK` |\n\n先印 `* HDLL RSP: DL_STATUS_OK`，再依 `pre_op`（前一個 frame 的 op code，即全域 `HDLL_CMD`）分支：\n\n### Payload 格式 — `pre_op == 'F1'`（DL_GET_VERSION 回應）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | HW version | 1 | raw hex |\n| 2 | ROM code | 1 | raw hex |\n| 3 | Model ID | 1 | raw hex |\n| 4 | FW version | 2 | raw hex |\n| 5 | Internal FW build revision | 4 | raw hex |\n| 6 | Chip version | 2 | raw hex |\n| 7 | Chip Life Cycle | 2 | raw hex |\n| 8 | Certificate version | 2 | raw hex |\n\n合計 15 bytes（Frame Length 16）。\n\n### Payload 格式 — `pre_op == 'F2'`（DL_GET_SESSION_STATE 回應）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Session State | 1 | handler 內區域表 `tbl_ssta`：`00` = closed、`01` = open、`02` = locked；其他值印 `RFU (xx)` |\n| 2 | （保留） | 2 | 跳過（程式一次前進 3 bytes） |\n\n### Payload 格式 — `pre_op == 'F4'`（DL_GET_DIE_ID 回應）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留） | 3 | 跳過，不印 |\n| 2 | DIEID | 16 | raw hex |\n\n合計 19 bytes（Frame Length 20）。\n\n### Payload 格式 — `pre_op == 'E0'`（DL_CHECK_INTEGRITY 回應）\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Nb of data sections | 1 | 整數 `data_num`（只用於表格輸出） |\n| 2 | Nb of code sections | 1 | 整數 `code_num` |\n| 3 | （保留） | 1 | 跳過 |\n| 4 | CRC check status | 4 | 32-bit 狀態位元，**以 little-endian 解讀**：第 4 個 byte 印為 `sections 1 to 8`、第 3 個為 `9 to 16`、第 2 個為 `17 to 24`、第 1 個為 `25 to 32`。之後把這 4 個 byte 依 1–8、9–16、17–24、25–32 的順序串成 32 字元的 bit 字串（每 byte MSB 在前）；data section `i`（1-based）的狀態 = 第 `i` 個 bit，code section `i` 的狀態 = 第 `i+28` 個 bit；`1` = OK、`0` = KO（handler 內區域表 `tbl_status`） |\n| 5 | Data sections | 4 × 28 = 112 | 固定 28 個 4-byte 值，每個值以 little-endian 反轉後顯示於括號內 |\n| 6 | Code sections | 4 × 4 = 16 | 固定 4 個 4-byte 值，同樣反轉後顯示 |\n\n合計 135 bytes（Frame Length 136 = 0x88）。輸出為 `* Flash integrity:` 表格，共 `min(max(data_num, code_num), 28)` 列：第 `i` 列在 `i` < `data_num` 時印 data section 狀態與值，`i` < `code_num` 時於同列右側印 code section 狀態與值；只有 code section 的列，左側 data 欄留白。\n\n### Payload 格式 — 其他 `pre_op`\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留） | 3 | 跳過，不印 |\n\n### 範例\n範例 1：`DL_GET_VERSION` → `DL_OK`（`pre_op = 'F1'`）\n- 第 1 筆 Raw：`00 04 F1 00 00 00 6E EF`\n\n```text\n  << Nxp HDLL: DL_GET_VERSION >>  \n  * HDLL CMD: DL_GET_VERSION\n  * CRC: 6EEF (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw：`00 10 00 12 40 04 01 03 01 02 03 04 33 00 C5 A0 01 00 CD D5`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * HW version: 12\n  * ROM code: 40\n  * Model ID: 04\n  * FW version: 0103\n  * Internal FW build revision: 01020304\n  * Chip version: 3300\n  * Chip Life Cycle: C5A0\n  * Certificate version: 0100\n  * CRC: CDD5 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例 2：`DL_GET_SESSION_STATE` → `DL_OK`（`pre_op = 'F2'`）\n- 第 1 筆 Raw：`00 04 F2 00 00 00 F5 33`\n\n```text\n  << Nxp HDLL: DL_GET_SESSION_STATE >>  \n  * HDLL CMD: DL_GET_SESSION_STATE\n  * CRC: F533 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw：`00 04 00 01 00 00 B0 26`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * Session State: open\n  * CRC: B026 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例 3：`DL_GET_SESSION_STATE` → `DL_OK` → `DL_OK`（第二個 `DL_OK` 的 `pre_op = '00'`，走「其他」分支）\n- 第 1 筆 Raw：`00 04 F2 00 00 00 F5 33`\n\n```text\n  << Nxp HDLL: DL_GET_SESSION_STATE >>  \n  * HDLL CMD: DL_GET_SESSION_STATE\n  * CRC: F533 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw：`00 04 00 01 00 00 B0 26`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * Session State: open\n  * CRC: B026 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 3 筆 Raw：`00 04 00 00 00 00 87 16`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * CRC: 8716 (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例 4：`DL_GET_DIE_ID` → `DL_OK`（`pre_op = 'F4'`）\n- 第 1 筆 Raw：`00 04 F4 00 00 00 D2 AA`\n\n```text\n  << Nxp HDLL: DL_GET_DIE_ID >>  \n  * HDLL CMD: DL_GET_DIE_ID\n  * CRC: D2AA (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw：`00 14 00 00 00 00 00 11 22 33 44 55 66 77 88 99 AA BB CC DD EE FF 64 8A`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * DIEID: 00112233445566778899AABBCCDDEEFF\n  * CRC: 648A (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例 5：`DL_CHECK_INTEGRITY` → `DL_OK`（`pre_op = 'E0'`；3 個 data sections、2 個 code sections，status byte 4 = `A0` = `10100000`，data section 1 OK / 2 KO / 3 OK；code section 1、2 對應第 29、30 bit，在 byte 1（`00`）中，故為 KO）\n- 第 1 筆 Raw：`00 04 E0 00 00 00 03 FC`\n\n```text\n  << Nxp HDLL: DL_CHECK_INTEGRITY >>  \n  * HDLL CMD: DL_CHECK_INTEGRITY\n  * CRC: 03FC (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw（140 bytes）：\n\n```text\n008800030200000000A00100010002000100030001000400010005000100060001000700010008000100090001000A0001000B0001000C0001000D0001000E0001000F000100100001001100010012000100130001001400010015000100160001001700010018000100190001001A0001001B0001001C000100810003008200030083000300840003000F4A\n```\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * CRC check for sections  1 to  8: A0\n  *                         9 to 16: 00\n  *                        17 to 24: 00\n  *                        25 to 32: 00\n  * Flash integrity:\n         Data:  3               Code:  2\n     1   OK (00010001)          KO (00030081)\n     2   KO (00010002)          KO (00030082)\n     3   OK (00010003)\n  * CRC: 0F4A (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n範例 6：`DL_CHECK_INTEGRITY` 後收到只有 3 bytes payload 的 `DL_OK` → handler 例外\n- 第 1 筆 Raw：`00 04 E0 00 00 00 03 FC`\n\n```text\n  << Nxp HDLL: DL_CHECK_INTEGRITY >>  \n  * HDLL CMD: DL_CHECK_INTEGRITY\n  * CRC: 03FC (CRC-16-CCITT-FALSE)\n#end\n```\n\n- 第 2 筆 Raw：`00 04 00 00 00 00 87 16`\n\n```text\n  << Nxp HDLL: DL_OK >>  \n  * HDLL RSP: DL_STATUS_OK\n  * CRC check for sections  1 to  8: \n  *                         9 to 16: \n  *                        17 to 24: \n  *                        25 to 32: \n(Python 例外：ValueError: invalid literal for int() with base 16: '')\n```\n\n\n### 實作備註\n- `pre_op == 'E0'` 分支假設 payload 一定是完整的 135 bytes；payload 不足時 `int('', 16)` 丟出 `ValueError`（範例 6），整行解析中斷、沒有 `#end`。\n- E0 分支的 `Nb of data sections` / `Nb of code sections` 原本的 print 被註解掉，只出現在 `Flash integrity` 表頭。\n- ✅ 已修正（2026-10）：E0 分支表格改跑 `max(data_num, code_num)` 列（上限 28），`code_num > data_num` 時多出的 code section 以 code-only 列印出。\n- code 狀態取 bit `i+28`，等於只用到 32-bit 狀態中的最後 4 bits（code section 最多 4 個）。\n- ✅ 已修正（2026-10）：`pre_op == 'F2'` 未知的 Session State 印 `RFU (xx)`。\n\n## 錯誤 / 狀態 RSP（`01` – `31`）\n\n| Op Code | Handler |\n|---|---|\n| `01` | [`HDLL.py:200`](../../nci_decoder/Nxp_pkg/HDLL.py#L200) `EDL_INVALID_ADDR` |\n| `02` | [`HDLL.py:207`](../../nci_decoder/Nxp_pkg/HDLL.py#L207) `EDL_GENERIC_ERROR` |\n| `0B` | [`HDLL.py:214`](../../nci_decoder/Nxp_pkg/HDLL.py#L214) `EDL_UNKNOW_CMD` |\n| `0C` | [`HDLL.py:221`](../../nci_decoder/Nxp_pkg/HDLL.py#L221) `EDL_ABORTED_CMD` |\n| `1E` | [`HDLL.py:228`](../../nci_decoder/Nxp_pkg/HDLL.py#L228) `EDL_ADDR_RANGE_OFL_ERROR` |\n| `1F` | [`HDLL.py:235`](../../nci_decoder/Nxp_pkg/HDLL.py#L235) `EDL_BUFFER_OFL_ERROR` |\n| `20` | [`HDLL.py:242`](../../nci_decoder/Nxp_pkg/HDLL.py#L242) `EDL_MEM_BSY` |\n| `21` | [`HDLL.py:249`](../../nci_decoder/Nxp_pkg/HDLL.py#L249) `EDL_SIGNATURE_ERROR` |\n| `24` | [`HDLL.py:256`](../../nci_decoder/Nxp_pkg/HDLL.py#L256) `EDL_FIRMWARE_VERSION_ERROR` |\n| `28` | [`HDLL.py:263`](../../nci_decoder/Nxp_pkg/HDLL.py#L263) `EDL_PROTOCOL_ERROR` |\n| `2D` | [`HDLL.py:270`](../../nci_decoder/Nxp_pkg/HDLL.py#L270) `PH_STATUS_DL_FIRST_CHUNK` |\n| `2E` | [`HDLL.py:277`](../../nci_decoder/Nxp_pkg/HDLL.py#L277) `PH_STATUS_DL_NEXT_CHUNK` |\n| `31` | [`HDLL.py:284`](../../nci_decoder/Nxp_pkg/HDLL.py#L284) `PH_STATUS_EDL_CERT_ERROR` |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | （保留） | 3 | 跳過，不印（所有錯誤 / 狀態 RSP 相同，不使用 `pre_op`） |\n\n### 範例\n- Raw：`00 04 01 00 00 00 F1 A2`\n\n```text\n  << Nxp HDLL: EDL_INVALID_ADDR >>  \n  * CRC: F1A2 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 02 00 00 00 6A 7E`\n\n```text\n  << Nxp HDLL: EDL_GENERIC_ERROR >>  \n  * CRC: 6A7E (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 0B 00 00 00 99 09`\n\n```text\n  << Nxp HDLL: EDL_UNKNOW_CMD >>  \n  * CRC: 9909 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 0C 00 00 00 C8 24`\n\n```text\n  << Nxp HDLL: EDL_ABORTED_CMD >>  \n  * CRC: C824 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 1E 00 00 00 3E EB`\n\n```text\n  << Nxp HDLL: EDL_ADDR_RANGE_OFL_ERROR >>  \n  * CRC: 3EEB (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 1F 00 00 00 48 5F`\n\n```text\n  << Nxp HDLL: EDL_BUFFER_OFL_ERROR >>  \n  * CRC: 485F (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 20 00 00 00 B0 58`\n\n```text\n  << Nxp HDLL: EDL_MEM_BSY >>  \n  * CRC: B058 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 21 00 00 00 C6 EC`\n\n```text\n  << Nxp HDLL: EDL_SIGNATURE_ERROR >>  \n  * CRC: C6EC (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 24 00 00 00 7A A9`\n\n```text\n  << Nxp HDLL: EDL_FIRMWARE_VERSION_ERROR >>  \n  * CRC: 7AA9 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 28 00 00 00 35 9B`\n\n```text\n  << Nxp HDLL: EDL_PROTOCOL_ERROR >>  \n  * CRC: 359B (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 2D 00 00 00 89 DE`\n\n```text\n  << Nxp HDLL: PH_STATUS_DL_FIRST_CHUNK >>  \n  * CRC: 89DE (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 2E 00 00 00 12 02`\n\n```text\n  << Nxp HDLL: PH_STATUS_DL_NEXT_CHUNK >>  \n  * CRC: 1202 (CRC-16-CCITT-FALSE)\n#end\n```\n\n- Raw：`00 04 31 00 00 00 DD 4B`\n\n```text\n  << Nxp HDLL: PH_STATUS_EDL_CERT_ERROR >>  \n  * CRC: DD4B (CRC-16-CCITT-FALSE)\n#end\n```\n\n\n### 實作備註\n- 這些 handler 不印任何欄位（連狀態名稱的 `* HDLL RSP:` 行都沒有），只靠標題 `<< Nxp HDLL: <名稱> >>` 表示狀態。\n\n---\n\n## 整體實作備註\n\n- ✅ 已修正（2026-10）：Chunk bit 判斷改為 `chunk == '1'`，byte0 bit 5 = 1 時印 `* Chunk: 1`（見 DL_GET_VERSION、DL_SEC_WRITE Middle 範例）。\n- ✅ 已修正（2026-10）：未知 op code 改用 `.get()`，標題印 `UNKNOWN (XX)`，並印 `Error: unknown HDLL op code XX, raw: <raw>`，不再 `KeyError`；例如：\n- Raw：`00 04 AA 00 00 00 05 CB`\n\n```text\n  << Nxp HDLL: UNKNOWN (AA) >>  \nError: unknown HDLL op code AA, raw: 0004AA00000005CB\n  * CRC: 05CB (CRC-16-CCITT-FALSE)\n#end\n```\n\n- **只有 Nxp vendor 有 HDLL**：`Decoder_Main.py` 的 HDLL 分支呼叫 `pkg.HDLL`，但只有 `Nxp_pkg.__ctrl__` 定義 `HDLL()`。vendor 傳 `'None'` 時同一筆 `00 04 F1 00 00 00 6E EF` 會丟出 `AttributeError: module 'nfc_forum_2_0_pkg.__ctrl__' has no attribute 'HDLL'`（已實際執行確認）。\n- ✅ 已修正（2026-10）：CRC 以 CRC-16-CCITT-FALSE 驗證，不一致時印 `    ! CRC mismatch: calculated YYYY`。\n- **CMD / RSP 不分方向**：完全靠 op code 值判斷（CMD 為 `C0`–`F4`、RSP 為 `00`–`31`），`HDLL_CMD` 也會被 RSP 覆寫。\n- **NCI 優先判斷**：若 HDLL frame 的第 3 byte（op code）剛好等於總長度 − 3，會被誤判為 NCI 封包；以目前的 op code 值與常見長度不會發生，但判斷順序如此。\n- 無 payload 的 CMD（`F0`/`F1`/`F2`/`F4`/`E0`）與錯誤 RSP 都假設 payload 固定為 3 bytes（Frame Length = 4）；其他長度會印 `Payload error!!`（見 DL_RESET 第二個範例）。\n- `Payload error!!` 訊息中印出的 `check` 為 handler 走過的 byte 數（不含 op code）。\n\n## 範例產生方式\n\n所有範例皆以 vendor `'Nxp'`、`mode = 2` 實際呼叫 `NFC_NCI_DECODER(len(raw)//2, raw, 'Nxp', 'None', 2)` 取得輸出（handler 丟出例外時，由測試程式 try/except 捕捉並以 `[測試程式捕捉到的例外]` 標示，該行不是 decoder 本身的輸出）；同一個「範例」中的多筆 frame 在同一個 Python process 內依序送入（以保留 `HDLL_CMD` 狀態），不同範例使用獨立 process（`HDLL_CMD` 從 `'00'` 開始）。CRC 欄位以 CRC-16-CCITT-FALSE 計算後附加。\n",Kn='# NXP NCI Core（GID 0x0）— `Nxp_pkg/NCI_Core.py`\n\n本文件說明 vendor = `Nxp` 時，GID `0x0`（NCI Core）各 command 的解析方式。Dispatch 表為 [`Nxp_pkg/__ctrl__.py`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L10) 的 `"NCI Core"` 群組，handler 實作於 [`Nxp_pkg/NCI_Core.py`](../../nci_decoder/Nxp_pkg/NCI_Core.py)。對照表一律來自 `Nxp_pkg/__table__.py`（見 [Tables](Tables.md)）。\n\nNXP 版與 forum 版（[`nfc_forum_2_0/NCI_Core.md`](../nfc_forum_2_0/NCI_Core.md)）的關係：\n\n- **大部分 handler 只是 delegate**：`Origin.<HANDLER>(raw, "nxp")`（`Origin` = `nfc_forum_2_0_pkg.NCI_Core`）。forum 函式內以 `pkg_import.tbl_import("nxp", ...)` → `vendor_registry.resolve()`（不分大小寫）載入 **`Nxp_pkg.__table__`**，所以解析流程與 forum 版相同，但查的是 NXP 的表（例如 `tbl_status_codes`、`tbl_rst_trig`、`tbl_rf_if`、`tbl_nfcee_id` 等含 SN2x0 擴充值）。\n- **NXP 自行實作的 handler**（6 個）：`CORE_RESET_NTF`、`CORE_SET_CONFIG_CMD`、`CORE_SET_CONFIG_RSP`、`CORE_GET_CONFIG_CMD`、`CORE_GET_CONFIG_RSP`、`CORE_CONN_CREATE_RSP`。\n- **NXP 專屬 config parameter**：當 Parameter ID 的第一個 octet 為 `A0` 或 `A1` 時，視為 **2-octet extended tag**（`A0xx` / `A1xx`，程式內稱 "Register"），值由 [`VALUE_OF_REGISTER`](#value_of_register--nxp-extended-parameter-a0xx--a1xx) 解析；其他 1-octet ID 由 NXP 本地版 [`VALUE_OF_CFG_PARA`](#value_of_cfg_para--標準-1-octet-parameter) 解析。\n\n## Command 總覽\n\n| OID | CMD | RSP | NTF | Handler（CMD / RSP / NTF） | 實作 |\n|---|---|---|---|---|---|\n| 0x00 | `20 00` | `40 00` | `60 00` | [CORE_RESET_CMD](#core_reset_cmd--20-00) / [CORE_RESET_RSP](#core_reset_rsp--40-00) / [CORE_RESET_NTF](#core_reset_ntf--60-00) | delegate / delegate / **NXP** |\n| 0x01 | `20 01` | `40 01` | — | [CORE_INIT_CMD](#core_init_cmd--20-01) / [CORE_INIT_RSP](#core_init_rsp--40-01) | delegate / delegate |\n| 0x02 | `20 02` | `40 02` | — | [CORE_SET_CONFIG_CMD](#core_set_config_cmd--20-02) / [CORE_SET_CONFIG_RSP](#core_set_config_rsp--40-02) | **NXP** / **NXP** |\n| 0x03 | `20 03` | `40 03` | — | [CORE_GET_CONFIG_CMD](#core_get_config_cmd--20-03) / [CORE_GET_CONFIG_RSP](#core_get_config_rsp--40-03) | **NXP** / **NXP** |\n| 0x04 | `20 04` | `40 04` | — | [CORE_CONN_CREATE_CMD](#core_conn_create_cmd--20-04) / [CORE_CONN_CREATE_RSP](#core_conn_create_rsp--40-04) | delegate / **NXP** |\n| 0x05 | `20 05` | `40 05` | — | [CORE_CONN_CLOSE_CMD](#core_conn_close_cmd--20-05) / [CORE_CONN_CLOSE_RSP](#core_conn_close_rsp--40-05) | delegate / delegate |\n| 0x06 | — | — | `60 06` | [CORE_CONN_CREDITS_NTF](#core_conn_credits_ntf--60-06) | delegate |\n| 0x07 | — | — | `60 07` | [CORE_GENERIC_ERROR_NTF](#core_generic_error_ntf--60-07) | delegate |\n| 0x08 | — | — | `60 08` | [CORE_INTERFACE_ERROR_NTF](#core_interface_error_ntf--60-08) | delegate |\n| 0x09 | `20 09` | `40 09` | — | [CORE_SET_POWER_SUB_STATE_CMD](#core_set_power_sub_state_cmd--20-09) / [CORE_SET_POWER_SUB_STATE_RSP](#core_set_power_sub_state_rsp--40-09) | delegate / delegate |\n\n共 **18** 個 handler（OID 0x0A–0x3F RFU，未定義）。另有兩個 helper：[`VALUE_OF_CFG_PARA`](#value_of_cfg_para--標準-1-octet-parameter)（[`NCI_Core.py:417`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L417)）與 [`VALUE_OF_REGISTER`](#value_of_register--nxp-extended-parameter-a0xx--a1xx)（[`NCI_Core.py:664`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L664)）。\n\n> 範例皆以 `NFC_NCI_DECODER(len, raw, \'Nxp\', \'None\', 2)` 實際執行取得（同一個 Python process 依序執行，見下方「模組狀態」說明）。\n\n### 模組狀態（跨封包的 global）\n\n`VALUE_OF_REGISTER` 使用 module-level global，解析結果會受**先前封包**影響：\n\n| Global | 初值 | 由誰寫入 | 由誰讀取 |\n|---|---|---|---|\n| `NCI_Core.RSTN_CFG` | `\'0\'` | `A007`（RSTN_CFG）的 bit0 | `A08E`（PHONE_OFF_ALLOWED） |\n| `NCI_Core.ULPDET_CFG` | `\'00\'` | `A10F`（ULPDET_CFG）的 byte0 | `A015`（DEFAULT_POWER）值 `03`/`05` |\n| `Proprietary.PWR_MODE_00` | `\'0\'` | `CORE_SET_POWER_MODE_CMD`（`2F 00`，見 [Proprietary.md](Proprietary.md)） | `A10B`（AUTONOMOUS_START_TIMEOUT） |\n\n---\n\n<a id="core_reset_cmd"></a><a id="CORE_RESET_CMD"></a>\n## CORE_RESET_CMD  (`20 00`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x00 / CMD |\n| Handler | [`NCI_Core.py:12`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L12) `CORE_RESET_CMD` |\n| 實作 | delegate → forum [`CORE_RESET_CMD`](../nfc_forum_2_0/NCI_Core.md#core_reset_cmd--20-00) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Reset Type | 1 | `tbl_cfg_status`（見 [Tables](Tables.md#tbl_cfg_status)） |\n\nNXP 差異：無（僅查表改用 NXP 的 `tbl_cfg_status`）。\n\n### 範例\n- Raw：`20 00 01 01`\n```text\n  << CORE_RESET_CMD >>  \n  * Reset Type: Reset Config (01)\n#end\n```\n\n<a id="core_reset_rsp"></a><a id="CORE_RESET_RSP"></a>\n## CORE_RESET_RSP  (`40 00`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x00 / RSP |\n| Handler | [`NCI_Core.py:22`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L22) `CORE_RESET_RSP` |\n| 實作 | delegate → forum [`CORE_RESET_RSP`](../nfc_forum_2_0/NCI_Core.md#core_reset_rsp--40-00) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n\nNXP 差異：無（查 NXP `tbl_status_codes`）。\n\n### 範例\n- Raw：`40 00 01 00`\n```text\n  << CORE_RESET_RSP >>  \n  * Status: STATUS_OK (00)\n#end\n```\n\n<a id="core_reset_ntf"></a><a id="CORE_RESET_NTF"></a>\n## CORE_RESET_NTF  (`60 00`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x00 / NTF |\n| Handler | [`NCI_Core.py:32`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L32) `CORE_RESET_NTF` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_RESET_NTF`](../nfc_forum_2_0/NCI_Core.md#core_reset_ntf--60-00)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Reset Trigger | 1 | `tbl_rst_trig`（見 [Tables](Tables.md#tbl_rst_trig)，含 SN2x0 `A0`–`A7`） |\n| 2 | Configuration Status | 1 | `tbl_cfg_status`（見 [Tables](Tables.md#tbl_cfg_status)） |\n\n**分支 A：Reset Trigger == `A0`（assert 觸發 reset）**\n\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 3 | dw Assertion Program Counter | 4 | 原樣印出 hex |\n\n**分支 B：其他 Reset Trigger**\n\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 3 | NCI Version | 1 | `tbl_nci_ver`（見 [Tables](Tables.md#tbl_nci_ver)） |\n| 4 | Manufacturer ID | 1 | `00` → "Info is not available."，其他印 hex |\n| 5 | Manufacturer Specific Information Length | 1 (n) | 讀取但不單獨顯示；決定下一欄的解析方式 |\n| 6 | Manufacturer Specific Information | n | n ≥ 5：拆成以下子欄位（原樣印 hex）；n > 5 時多出的 n−5 bytes 另印 `* Manufacturer Specific Info (extra): <hex>`。0 < n < 5：整段印 `* Manufacturer Specific Info: <hex>`。n = 0：不印 |\n| ﹂ | Model ID | 1 | hex |\n| ﹂ | Hw Ver nb | 1 | hex |\n| ﹂ | ROM Code Ver nb | 1 | hex |\n| ﹂ | FLASH Ver | 2 | hex（不做 byte swap） |\n\n與 forum 版差異：forum 版依 Length 欄位讀 n bytes 並整段印出；NXP 版同樣依 Length 讀 n bytes，但 n ≥ 5 時把前 5 bytes 拆成 SN2x0 版本資訊子欄位，並多了 `A0` 分支。\n\n### 範例\n- Raw：`60 00 0A 02 01 20 02 05 01 02 03 0A 00`\n```text\n  << CORE_RESET_NTF >>  \n  * Reset Trigger: CORE_RESET_CMD (02)\n  * Config Status: Reset Config (01)\n  * NCI Version: 2.0 (20)\n  * Manufacturer ID: 02\n  * Model ID: 01\n  * Hw Ver nb: 02\n  * ROM Code Ver nb: 03\n  * FLASH Ver: 0A00\n#end\n```\n- Raw：`60 00 06 A0 01 12 34 56 78`（assert 分支）\n```text\n  << CORE_RESET_NTF >>  \n  * Reset Trigger: An assert has triggered SN2x0 NFCC reset/reboot (A0)\n  * Config Status: Reset Config (01)\n  * dw Assertion Program Counter: 12345678\n#end\n```\n\n### 實作備註\n- ✅ 已修正（2026-10）：依 Manufacturer Specific Information Length 讀取；≥ 5 bytes 拆成具名欄位，多出部分印 `(extra)` 行，< 5 bytes 整段印 raw，不再因長度 ≠ 5 而 `Payload error!!`。\n- ✅ 已修正（2026-10）：輸出標籤改為正確的 `Reset Trigger`。\n\n<a id="core_init_cmd"></a><a id="CORE_INIT_CMD"></a>\n## CORE_INIT_CMD  (`20 01`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x01 / CMD |\n| Handler | [`NCI_Core.py:95`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L95) `CORE_INIT_CMD` |\n| 實作 | delegate → forum [`CORE_INIT_CMD`](../nfc_forum_2_0/NCI_Core.md#core_init_cmd--20-01) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Feature Enable | 2 | 原樣 hex，後綴 `-- RFU` |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`20 01 02 00 00`\n```text\n  << CORE_INIT_CMD >>  \n  * Feature Enable: 0000 -- RFU\n#end\n```\n\n<a id="core_init_rsp"></a><a id="CORE_INIT_RSP"></a>\n## CORE_INIT_RSP  (`40 01`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x01 / RSP |\n| Handler | [`NCI_Core.py:105`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L105) `CORE_INIT_RSP` |\n| 實作 | delegate → forum [`CORE_INIT_RSP`](../nfc_forum_2_0/NCI_Core.md#core_init_rsp--40-01) |\n\n### Payload 格式\n欄位與 forum 版完全相同（Status / NFCC Features 4 octets / Max Logical Connections / Max Routing Table Size / Max Control Packet Payload Size / Max Data Packet Payload Size of Static HCI Conn / Number of Credits of Static HCI Conn / Max NFC-V RF Frame Size / Number of Supported RF Interfaces / Supported RF Interface[n] = Interface + Number of Extensions + Extension List），詳見 forum 文件。\n\n使用的 NXP 表：`tbl_status_codes`、`tbl_nfcc_feat_oct1`、`tbl_nfcc_feat_oct2`、`tbl_rf_if`（含 SN2x0 `80` TAG-CMD、`81` WLC_RF、`83` NFCEE_DEP_RF_eSE）、`tbl_rf_if_exten`（見 [Tables](Tables.md#tbl_rf_if)）。\n\nNXP 差異：\n- forum 程式中 `if(int(max_logical_conn, 16) >= 15 and vendor == "None")` 才會把 Max Logical Connections ≥ 0x0F 顯示為 RFU；NXP 傳入 `vendor="nxp"`，因此**一律以十進位數值顯示**。\n\n### 範例\n- Raw：`40 01 13 00 1F 0E 02 00 0A 00 00 FF 02 FF 00 01 02 02 00 03 01 00`\n```text\n  << CORE_INIT_RSP >>  \n  * Status: STATUS_OK (00)\n  * NFCC Features: 1F0E0200\n\n    * Octet 0: 00011111\n     ~ Active Communication Mode:       Support\n     ~ HCI Network Support:             Implements as defined in [ETSI_102622]\n     ~ Discovery Cfg Mode:              RFU\n     ~ Discovery Freq Cfg:              Supported in RF_DISCOVER_CMD\n\n    * Octet 1: 00001110\n     ~ Forced NFCEE routing:            Not support\n     ~ APDU Pattern based routing:      Not support\n     ~ System Code based routing:       Not support\n     ~ AID based routing:               Support\n     ~ Protocol based routing:          Support\n     ~ Technology based routing:        Support\n\n    * Octet 2: 00000010\n     ~ RF Cfg in Switched Off State:    Not support\n     ~ Switched On Sub-Mode States:     Not support\n     ~ Switched Off State:              Support\n     ~ Battery Off State:               Not support\n\n    * Octet 3: 00000000 -- Proprietary\n\n  * Max Logical Connections: 10 (0A)\n  * Max Routing Table Size: 0 (0000)\n  * Max Control Packet Payload Size: 255 (FF)\n  * Max Data Packet Payload Size of the Static HCI Connection: 2 (02)\n  * Number of Credits of the Static HCI Connection: 255 (FF)\n  * Max NFC-V RF Frame Size: 256 (0001)\n  * Number of Supported RF Interfaces: 2\n  * Supported RF Interface: 0200030100\n\n   ~ [RF_IF_0] ~  \n    * Interface: ISO-DEP (02)\n    * Number of Extensions: 0\n\n   ~ [RF_IF_1] ~  \n    * Interface: NFC-DEP (03)\n    * Number of Extensions: 1\n    * Extension 0: Frame Aggregated RF Interface Extension (00)\n#end\n```\n\n<a id="core_set_config_cmd"></a><a id="CORE_SET_CONFIG_CMD"></a>\n## CORE_SET_CONFIG_CMD  (`20 02`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x02 / CMD |\n| Handler | [`NCI_Core.py:127`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L127) `CORE_SET_CONFIG_CMD` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_SET_CONFIG_CMD`](../nfc_forum_2_0/NCI_Core.md#core_set_config_cmd--20-02)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Number of Parameters | 1 (n) | 十進位 |\n| 2 | Parameter [1..n] | 每筆 m+2 或 m+3 | 逐筆解析如下 |\n| ﹂ | ID（第 1 octet ∉ {`A0`,`A1`}） | 1 | `lookup(tbl_cfg_para, id)`（含範圍 key，例如 `A0-FE` → Reserved；查不到 RFU，見 [Tables](Tables.md#tbl_cfg_para)），印為 `ID:` |\n| ﹂ | Register（第 1 octet ∈ {`A0`,`A1`}） | 2 | 讀 2 octets 成 `A0xx`/`A1xx`，`lookup(tbl_cfg_para, reg)`，印為 `Register:` |\n| ﹂ | Len | 1 (m) | 十進位 |\n| ﹂ | Val | m | m ≠ 0 時：1-octet ID → [`VALUE_OF_CFG_PARA(id, val)`](#value_of_cfg_para--標準-1-octet-parameter)；Register → [`VALUE_OF_REGISTER(reg, val, m)`](#value_of_register--nxp-extended-parameter-a0xx--a1xx)。m = 0 時不印 Val |\n\n與 forum 版差異：forum 版 ID 一律 1 octet；NXP 版新增 `A0`/`A1` 2-octet extended tag 判斷與 `VALUE_OF_REGISTER` 解析。\n\n### 範例\n- Raw：`20 02 14 05 00 02 E8 03 80 01 01 A1 0F 02 01 01 A0 15 01 03 A5 01 00`（混合標準 ID、NXP Register、非 A0/A1 的 proprietary ID）\n```text\n  << CORE_SET_CONFIG_CMD >>  \n  * Number of Params: 5\n\n   ~ [Param_0] ~  \n    * ID: TOTAL_DURATION (00)\n    * Len: 2\n    * Val: 1000 ms (E803)\n\n   ~ [Param_1] ~  \n    * ID: RF_FIELD_INFO (80)\n    * Len: 1\n    * Val: 01\n     ~ RF_FIELD_INFO_NTF: Enabled\n\n   ~ [Param_2] ~  \n    * Register: ULPDET_CFG (A10F)\n    * Len: 2\n    * Val: 0101\n      * ULPDET mode: Enabled \n       ~ NFC_GPIO2_AO is high when wake up from ULPDET mode, Low when enter in Standby mode.\n\n   ~ [Param_3] ~  \n    * Register: DEFAULT_POWER (A015)\n    * Len: 1\n    * Val: Autonomous Mode + ULPDET\n\n   ~ [Param_4] ~  \n    * ID: Reserved (A5)\n    * Len: 1\n    * Val: 00\n#end\n```\n（`A015 = 03` 顯示 "+ ULPDET" 是因為同一封包前面的 `A10F` 已把 global `ULPDET_CFG` 設為 `01`。）\n\n### 實作備註\n- ✅ 已修正（2026-10）：改用 `range_lookup.lookup()`，`tbl_cfg_para` 的 `\'A0-FE\'` 範圍 key 生效，`A2`–`FE` 的 1-octet ID 顯示為 `Reserved`（例如上例 `A5`）。\n- 未在 `VALUE_OF_REGISTER` 中列出的 Register（例如 `A001`）只印 `* Val: <hex>`。\n\n<a id="core_set_config_rsp"></a><a id="CORE_SET_CONFIG_RSP"></a>\n## CORE_SET_CONFIG_RSP  (`40 02`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x02 / RSP |\n| Handler | [`NCI_Core.py:177`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L177) `CORE_SET_CONFIG_RSP` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_SET_CONFIG_RSP`](../nfc_forum_2_0/NCI_Core.md#core_set_config_rsp--40-02)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n| 2 | Number of Parameters | 1 (n) | 十進位 |\n| 3 | Parameter ID [0..n] | 每筆 1 或 2 | 第 1 octet ∈ {`A0`,`A1`} → 讀 2 octets（`A0xx`/`A1xx`），否則讀 1 octet；皆印 `ID i: <name> (id)`，名稱查 `lookup(tbl_cfg_para, id)`（見 [Tables](Tables.md#tbl_cfg_para)） |\n\n與 forum 版差異：forum 版 Parameter ID 一律 1 octet；NXP 版加入 `A0`/`A1` 2-octet extended tag 判斷。\n\n### 範例\n- Raw：`40 02 02 00 00`\n```text\n  << CORE_SET_CONFIG_RSP >>  \n  * Status: STATUS_OK (00)\n  * Number of Params: 0\n#end\n```\n- Raw：`40 02 04 09 02 A0 15`\n```text\n  << CORE_SET_CONFIG_RSP >>  \n  * Status: STATUS_INVALID_PARAM (09)\n  * Number of Params: 2\n  * Set Param ID:\n    * ID 0: DEFAULT_POWER (A015)\n    * ID 1: RFU ()\n#end\n```\n\n### 實作備註\n- ✅ 已修正（2026-10）：改為 NXP 自行實作，`A0xx`/`A1xx` 以 2-octet ID 讀取（如 `A0 15` → `DEFAULT_POWER (A015)`）；上例第 2 筆 `RFU ()` 是因為範例封包本身只帶 1 個 ID 卻宣告 2 個。\n\n<a id="core_get_config_cmd"></a><a id="CORE_GET_CONFIG_CMD"></a>\n## CORE_GET_CONFIG_CMD  (`20 03`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x03 / CMD |\n| Handler | [`NCI_Core.py:208`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L208) `CORE_GET_CONFIG_CMD` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_GET_CONFIG_CMD`](../nfc_forum_2_0/NCI_Core.md#core_get_config_cmd--20-03)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Number of Parameters | 1 (n) | 十進位 |\n| 2 | Parameter ID [0..n] | 1 或 2 | 第 1 octet ∈ {`A0`,`A1`} → 讀 2 octets 印 `Register: <name> (A0xx)`；否則讀 1 octet 印 `ID i: <name> (xx)`。皆查 `tbl_cfg_para`（見 [Tables](Tables.md#tbl_cfg_para)） |\n\n### 範例\n- Raw：`20 03 07 04 02 A0 15 A1 0E 85`\n```text\n  << CORE_GET_CONFIG_CMD >>  \n  * Number of Params: 4\n  * Get Param ID:\n    * ID 0: CON_DISCOVERY_PARAM (02)\n    * Register: DEFAULT_POWER (A015)\n    * Register: GUARD_TIMEOUT_Tx2Rx (A10E)\n    * ID 3: NFCC_CONFIG_CONTROL (85)\n#end\n```\n\n### 實作備註\n- Register 項目不印序號 `i`，只有 1-octet ID 會印 `ID i:`。\n\n<a id="core_get_config_rsp"></a><a id="CORE_GET_CONFIG_RSP"></a>\n## CORE_GET_CONFIG_RSP  (`40 03`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x03 / RSP |\n| Handler | [`NCI_Core.py:237`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L237) `CORE_GET_CONFIG_RSP` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_GET_CONFIG_RSP`](../nfc_forum_2_0/NCI_Core.md#core_get_config_rsp--40-03)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n| 2 | Number of Parameters | 1 (n) | 十進位 |\n| 3 | Parameter [1..n] | m+2 或 m+3 | 與 [CORE_SET_CONFIG_CMD](#core_set_config_cmd--20-02) 的 Parameter 結構與解析完全相同（ID/Register → Len → Val；Val 交給 `VALUE_OF_CFG_PARA` / `VALUE_OF_REGISTER`） |\n\n### 範例\n- Raw：`40 03 10 00 03 A0 15 01 02 A0 85 04 78 88 AA 2C 85 01 01`\n```text\n  << CORE_GET_CONFIG_RSP >>  \n  * Status: STATUS_OK (00)\n  * Number of Params: 3\n\n   ~ [Param_0] ~  \n    * Register: DEFAULT_POWER (A015)\n    * Len: 1\n    * Val: Autonomous Mode\n\n   ~ [Param_1] ~  \n    * Register: RF_MISC_SETTINGS (A085)\n    * Len: 4\n    * Val: 7888AA2C\n      * b_val: 00101100101010101000100001111000\n      * Uncomplia nt 13.5MHz readers:            Enabled \n      * SFGT Early Exchange:                     Enabled \n      * PCD Block nb Check:                      Enabled \n      * Mute To RATS with non ISO-DEP SAK:       Disabled\n      * Multiple Tag during collision:           Disabled\n      * NAK To RATS:                             Disabled\n      * Illegal Uid 0 (Yangchengtong):           Support\n      * Non Compliant Mifare Reader:             Not support\n      * Non Compliant Mifare Reader (Changchun): Not support\n\n   ~ [Param_2] ~  \n    * ID: NFCC_CONFIG_CONTROL (85)\n    * Len: 1\n    * Val: 00000001 (01)\n     ~ NFCC is allowed to manage RF config.\n#end\n```\n更多單一 Register 的解析輸出見 [附錄：Register 解析範例](#附錄register-解析範例)。\n\n### 實作備註\n- 即使 Status ≠ `00`，仍會繼續解析 Number of Parameters 與 Parameter 清單（無 status 分支）。\n\n<a id="core_conn_create_cmd"></a><a id="CORE_CONN_CREATE_CMD"></a>\n## CORE_CONN_CREATE_CMD  (`20 04`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x04 / CMD |\n| Handler | [`NCI_Core.py:292`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L292) `CORE_CONN_CREATE_CMD` |\n| 實作 | delegate → forum [`CORE_CONN_CREATE_CMD`](../nfc_forum_2_0/NCI_Core.md#core_conn_create_cmd--20-04) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Destination Type | 1 | `tbl_dest_type`（見 [Tables](Tables.md#tbl_dest_type)） |\n| 2 | Number of Destination-specific Parameters | 1 (n) | 十進位 |\n| 3 | Destination-specific Parameter [0..n] | m+2 | TLV |\n| ﹂ | Type | 1 | `tbl_d_spec_type`（見 [Tables](Tables.md#tbl_d_spec_type)） |\n| ﹂ | Len | 1 (m) | 十進位 |\n| ﹂ | Val（Type `00`） | 2 | octet0 RF Discovery ID：`tbl_rf_dis_id.get(v, v)`（見 [Tables](Tables.md#tbl_rf_dis_id)）；octet1 RF Protocol：`tbl_rf_proto`（見 [Tables](Tables.md#tbl_rf_proto)） |\n| ﹂ | Val（Type `01`） | 2 | octet0 NFCEE ID：`00` DH / `01` HCI Network / `FF` RFU / 其他印 hex + 三行固定範圍說明；octet1 NFCEE Interface Protocol：`tbl_nfcee_proto`（見 [Tables](Tables.md#tbl_nfcee_proto)） |\n| ﹂ | Val（其他 Type） | m | 印 raw + 固定 RFU / proprietary 說明 |\n\nNXP 差異：無（查 NXP 表）。注意 NFCEE ID 這裡**不**查 NXP `tbl_nfcee_id`，所以 `C0` 不會顯示 `NFCEE_eSE`。\n\n### 範例\n- Raw：`20 04 06 03 01 01 02 C0 00`\n```text\n  << CORE_CONN_CREATE_CMD >>  \n  * Destination Type: NFCEE (03)\n  * Number of Destination-specific Params: 1\n\n   ~ [Dest-spec Parameter_0] ~  \n    * Type: NFCEE ID + NFCEE Interface Protocol (01)\n    * Len: 2\n    * Val: C000\n      * NFCEE ID: NFCEE_eSE (C0)\n      * NFCEE Interface Protocol: APDU (00)\n#end\n```\n- Raw：`20 04 06 02 01 00 02 01 04`\n```text\n  << CORE_CONN_CREATE_CMD >>  \n  * Destination Type: Remote NFC Endpoint (02)\n  * Number of Destination-specific Params: 1\n\n   ~ [Dest-spec Parameter_0] ~  \n    * Type: RF Discovery ID + RF Protocol (00)\n    * Len: 2\n    * Val: 0104\n      * RF Discovery ID: Dynamically assigned by the NFCC (01)\n      * RF Protocol: ISO-DEP (04)\n#end\n```\n\n<a id="core_conn_create_rsp"></a><a id="CORE_CONN_CREATE_RSP"></a>\n## CORE_CONN_CREATE_RSP  (`40 04`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x04 / RSP |\n| Handler | [`NCI_Core.py:307`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L307) `CORE_CONN_CREATE_RSP` |\n| 實作 | **NXP 自行實作**（forum 版見 [`CORE_CONN_CREATE_RSP`](../nfc_forum_2_0/NCI_Core.md#core_conn_create_rsp--40-04)） |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n| 2 | Max Data Packet Payload Size | 1 | **僅 Status == `00` 時解析**；十進位 |\n| 3 | Initial Number of Credits | 1 | 僅 Status == `00`；若值在 `tbl_init_credits`（見 [Tables](Tables.md#tbl_init_credits)）則印表值，否則十進位 |\n| 4 | Conn ID | 1 | 僅 Status == `00`；十進位 + `tbl_conn_id`（以低 4 bits 的 binary 字串為 key，見 [Tables](Tables.md#tbl_conn_id)），查不到 → "Dynamically assigned by the NFCC" |\n\n與 forum 版差異：forum 版不論 Status 一律解析 4 個欄位；NXP 版只有 `STATUS_OK` 才解析後 3 欄（符合 NCI 規範中失敗時 RSP 只有 Status 的情況）。\n\n### 範例\n- Raw：`40 04 04 00 FF 01 03`\n```text\n  << CORE_CONN_CREATE_RSP >>  \n  * Status: STATUS_OK (00)\n  * Max Data Packet Payload Size: 255\n  * Initial Number of Credits: 1\n  * Conn ID: 3 (Dynamically assigned by the NFCC)\n#end\n```\n- Raw：`40 04 01 03`\n```text\n  << CORE_CONN_CREATE_RSP >>  \n  * Status: STATUS_FAILED (03)\n#end\n```\n\n### 實作備註\n- Conn ID 輸出缺少右括號 `)`（[`NCI_Core.py:335`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L335)，forum 版有補上）。\n\n<a id="core_conn_close_cmd"></a><a id="CORE_CONN_CLOSE_CMD"></a>\n## CORE_CONN_CLOSE_CMD  (`20 05`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x05 / CMD |\n| Handler | [`NCI_Core.py:341`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L341) `CORE_CONN_CLOSE_CMD` |\n| 實作 | delegate → forum [`CORE_CONN_CLOSE_CMD`](../nfc_forum_2_0/NCI_Core.md#core_conn_close_cmd--20-05) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Conn ID | 1 | 低 4 bits 十進位 + `tbl_conn_id`（見 [Tables](Tables.md#tbl_conn_id)） |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`20 05 01 03`\n```text\n  << CORE_CONN_CLOSE_CMD >>  \n  * Conn ID: 3 (Dynamically assigned by the NFCC)\n#end\n```\n\n### 實作備註\n- ✅ 已修正（2026-10）：forum 版改用共用的 `CONN_ID_TEXT()`，輸出補上右括號，且 Conn ID 只取低 4 bits（高 bits 為 RFU）。\n\n<a id="core_conn_close_rsp"></a><a id="CORE_CONN_CLOSE_RSP"></a>\n## CORE_CONN_CLOSE_RSP  (`40 05`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x05 / RSP |\n| Handler | [`NCI_Core.py:351`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L351) `CORE_CONN_CLOSE_RSP` |\n| 實作 | delegate → forum [`CORE_CONN_CLOSE_RSP`](../nfc_forum_2_0/NCI_Core.md#core_conn_close_rsp--40-05) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`40 05 01 00`\n```text\n  << CORE_CONN_CLOSE_RSP >>  \n  * Status: STATUS_OK (00)\n#end\n```\n\n<a id="core_conn_credits_ntf"></a><a id="CORE_CONN_CREDITS_NTF"></a>\n## CORE_CONN_CREDITS_NTF  (`60 06`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x06 / NTF |\n| Handler | [`NCI_Core.py:361`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L361) `CORE_CONN_CREDITS_NTF` |\n| 實作 | delegate → forum [`CORE_CONN_CREDITS_NTF`](../nfc_forum_2_0/NCI_Core.md#core_conn_credits_ntf--60-06) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Number of Entries | 1 (n) | 十進位 |\n| 2 | Entry [1..n] | 2 | |\n| ﹂ | Conn ID | 1 | 十進位 + `tbl_conn_id`（見 [Tables](Tables.md#tbl_conn_id)） |\n| ﹂ | Credits | 1 | 十進位 |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`60 06 05 02 00 01 03 02`\n```text\n  << CORE_CONN_CREDITS_NTF >>  \n  * Number of Entries: 2\n\n   ~ [Entry_0] ~  \n    * Conn ID: 0 (Static: DH -- Remote NFC Endpoint)\n    * Credits: 1\n\n   ~ [Entry_1] ~  \n    * Conn ID: 3 (Dynamically assigned by the NFCC)\n    * Credits: 2\n#end\n```\n\n<a id="core_generic_error_ntf"></a><a id="CORE_GENERIC_ERROR_NTF"></a>\n## CORE_GENERIC_ERROR_NTF  (`60 07`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x07 / NTF |\n| Handler | [`NCI_Core.py:374`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L374) `CORE_GENERIC_ERROR_NTF` |\n| 實作 | delegate → forum [`CORE_GENERIC_ERROR_NTF`](../nfc_forum_2_0/NCI_Core.md#core_generic_error_ntf--60-07) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n\nNXP 差異：無（查 NXP `tbl_status_codes`）。\n\n### 範例\n- Raw：`60 07 01 0B`\n```text\n  << CORE_GENERIC_ERROR_NTF >>  \n  * Status: RFU (0B)\n#end\n```\n\n<a id="core_interface_error_ntf"></a><a id="CORE_INTERFACE_ERROR_NTF"></a>\n## CORE_INTERFACE_ERROR_NTF  (`60 08`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x08 / NTF |\n| Handler | [`NCI_Core.py:384`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L384) `CORE_INTERFACE_ERROR_NTF` |\n| 實作 | delegate → forum [`CORE_INTERFACE_ERROR_NTF`](../nfc_forum_2_0/NCI_Core.md#core_interface_error_ntf--60-08) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n| 2 | Conn ID | 1 | 十進位 + `tbl_conn_id`（見 [Tables](Tables.md#tbl_conn_id)） |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`60 08 02 B0 03`\n```text\n  << CORE_INTERFACE_ERROR_NTF >>  \n  * Status: RF_TRANSMISSION_EXCEPTION (B0)\n  * Conn ID: 3 (Dynamically assigned by the NFCC)\n#end\n```\n\n### 實作備註\n- ✅ 已修正（2026-10）：forum 版改用共用的 `CONN_ID_TEXT()`，輸出補上右括號，且 Conn ID 只取低 4 bits（高 bits 為 RFU）。\n\n<a id="core_set_power_sub_state_cmd"></a><a id="CORE_SET_POWER_SUB_STATE_CMD"></a>\n## CORE_SET_POWER_SUB_STATE_CMD  (`20 09`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x09 / CMD |\n| Handler | [`NCI_Core.py:395`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L395) `CORE_SET_POWER_SUB_STATE_CMD` |\n| 實作 | delegate → forum [`CORE_SET_POWER_SUB_STATE_CMD`](../nfc_forum_2_0/NCI_Core.md#core_set_power_sub_state_cmd--20-09) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Power State | 1 | 程式內 if/elif：`00` Switched On State、`01`/`02`/`03` Switched On Sub-State 1/2/3（附 Screen / Device 狀態），其他 RFU |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`20 09 01 01`\n```text\n  << CORE_SET_POWER_SUB_STATE_CMD >>  \n  * Power State: Switched On Sub-State 1\n    * Screen: Off\n    * Device: Unlocked\n#end\n```\n\n<a id="core_set_power_sub_state_rsp"></a><a id="CORE_SET_POWER_SUB_STATE_RSP"></a>\n## CORE_SET_POWER_SUB_STATE_RSP  (`40 09`)\n\n| 項目 | 值 |\n|---|---|\n| GID / OID / MT | NCI Core / 0x09 / RSP |\n| Handler | [`NCI_Core.py:405`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L405) `CORE_SET_POWER_SUB_STATE_RSP` |\n| 實作 | delegate → forum [`CORE_SET_POWER_SUB_STATE_RSP`](../nfc_forum_2_0/NCI_Core.md#core_set_power_sub_state_rsp--40-09) |\n\n### Payload 格式\n| # | 欄位 | 長度 (Octets) | 解析方式 / 對照表 |\n|---|---|---|---|\n| 1 | Status | 1 | `tbl_status_codes`（見 [Tables](Tables.md#tbl_status_codes)） |\n\nNXP 差異：無。\n\n### 範例\n- Raw：`40 09 01 00`\n```text\n  << CORE_SET_POWER_SUB_STATE_RSP >>  \n  * Status: STATUS_OK (00)\n#end\n```\n\n---\n\n<a id="value_of_cfg_para"></a><a id="VALUE_OF_CFG_PARA"></a>\n## VALUE_OF_CFG_PARA — 標準 1-octet parameter\n\n[`NCI_Core.py:417`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L417) `VALUE_OF_CFG_PARA(id, val)`\n\nNXP 保留一份 forum `VALUE_OF_CFG_PARA`（forum `NCI_Core.py:656`）的本地副本，用於 CORE_SET_CONFIG_CMD / CORE_GET_CONFIG_RSP 中**非** `A0`/`A1` 開頭的 ID。各 ID（`00`、`02`、`03`、`08`/`11`/`19`、`09`/`14`/`1A`/`2F`、`10`、`12`、`13`、`18`/`21`/`3E`/`5B`/`68`、`20`、`28`、`29`、`2A`/`62`、`30`–`33`、`38`–`3C`、`40`–`4F`、`52`、`53`、`55`、`50`、`58`–`5A`、`5C`、`60`、`61`、`80`–`83`、`85`）的解析方式與 forum 版完全相同，詳見 forum 文件 [CORE_SET_CONFIG_CMD](../nfc_forum_2_0/NCI_Core.md#core_set_config_cmd--20-02)；名稱查 NXP [`tbl_cfg_para`](Tables.md#tbl_cfg_para)、bit rate 查 NXP [`tbl_bit_rates`](Tables.md#tbl_bit_rates)。未列出的 ID 一律 `* Val: <hex>`。\n\n與 forum 版唯一差異：**`0x82` NFCDEP_OP** 的 b4–b1 四個 bit，forum 版只在 bit = 1 時印一句完整描述；NXP 版每個 bit 都印 `<描述>: Apply / Not apply`（b5 Waiting Time 兩版相同）。\n\n| bit（val_b index） | NXP 輸出標籤 |\n|---|---|\n| b4（`[3:4]`） | `Waiting Time: <= 10` / `<= WT_(NFCDEP,MAX)` |\n| b3（`[4:5]`） | `PDUs chaining (MI bit set) with max Transport Data Bytes: Apply/Not apply` |\n| b2（`[5:6]`） | `PDU with no Transport Data Bytes SHALL NOT be sent: Apply/Not apply` |\n| b1（`[6:7]`） | `Initiator SHALL use ATTENTION CMD only as error recovery procedure: Apply/Not apply` |\n| b0（`[7:8]`） | `NFC-DEP Target SHALL NOT send RTOX requests: Apply/Not apply` |\n\n（程式中 `val_b = bin(int(val,16))[2:].zfill(8)`，字串 index `i` 對應 bit `7-i`。）\n\n**1-octet bit-field 參數的長度檢查**（2026-10 新增）：`VALUE_OF_CFG_PARA` 現在是一層 wrapper，實際解析在 `VALUE_OF_CFG_PARA_BODY`。對 `CFG_BITFIELD_1OCT` 內的 ID（`02`、`13`、`2A`、`30`、`31`、`32`、`38`、`3C`、`50`、`5C`、`62`、`82`、`85`），若 Len > 1，只取第 1 個 octet 解析，並在最後多印一行 `* Warning: Len <m>, expected 1 (raw <hex>)`（例：`20 02 05 01 02 02 03 00` → `Warning: Len 2, expected 1 (raw 0300)`），不再因整段 value 轉成 bit 字串而錯位。\n\n---\n\n<a id="value_of_register"></a><a id="VALUE_OF_REGISTER"></a>\n## VALUE_OF_REGISTER — NXP extended parameter (A0xx / A1xx)\n\n[`NCI_Core.py:664`](../../nci_decoder/Nxp_pkg/NCI_Core.py#L664) `VALUE_OF_REGISTER(tag, val, val_len)`\n\n- `tag`：4 位 hex 字串（例如 `A015`）；`val`：value 的 hex 字串；`val_len`：Len 欄位（octets）。\n- 名稱來自 NXP [`tbl_cfg_para`](Tables.md#tbl_cfg_para)（程式註解引用 SN2x0 User Manual Table 97–103、108，及 SN220 RF Register Setting Guidelines / AN13076）。\n- 下表「byte n」指 value 的第 n 個 octet（0 起算）；「LE」表示 `int(byte0) + int(byte1)*256`（little endian）；`bN` 指該 byte 的 bit N。`tbl_general_status`：`00` Disabled / `01` Enabled；`tbl_general_status_n`：`00` Enabled / `01` Disabled（反相），程式多以 `\'0\' + bit` 組 key 查表（見 [Tables](Tables.md#tbl_general_status)、[Tables](Tables.md#tbl_general_status_n)）。\n- 函式本身**不檢查長度**、不回傳 offset；外層 handler 一律以 Len 前進，所以 value 太短時欄位會印空字串或丟 exception（見各列備註）。\n\n### Table 97. Core configuration parameters\n\n| Tag | 名稱 | 行 | Value 解析方式 |\n|---|---|---|---|\n| `A001` | NFCC_DIE_ID | — | 無專屬分支，印 raw |\n| `A015` | DEFAULT_POWER | [669](../../nci_decoder/Nxp_pkg/NCI_Core.py#L669) | `01` Standby State；`02` Autonomous Mode；`03` Autonomous Mode（若 global `ULPDET_CFG==\'01\'` 加 " + ULPDET"）；`05` Autonomous Mode（若 `ULPDET_CFG==\'01\'` 加 " + ULPDET With Notification"）；其他值印 `RFU (xx)` |\n| `A00A` | WAIT_FOR_STABLE_SYSCLOCK | [689](../../nci_decoder/Nxp_pkg/NCI_Core.py#L689) | Guard Time = 整個 value 十進位 × 18.8 μs |\n| `A010` | CLKGEN | [694](../../nci_decoder/Nxp_pkg/NCI_Core.py#L694) | 只看 byte1（XtalConfig）：b0 Calibration Restart on Wake-up（`tbl_general_status`）；b0=1 時 b3..b1 → Internal Cap（0 = no internal cap (2 pF parasitic)、1..7 = 4..10 pF）。byte0 不解析 |\n| `A011` | RF_CLOCK_CFG | [702](../../nci_decoder/Nxp_pkg/NCI_Core.py#L702) | byte0 Input clock freq（[`tbl_in_clk_freq`](Tables.md#tbl_in_clk_freq)）；byte1 b7=1 且 byte0==`09` → "Reader mode: disable, Card mode: Clock-less"，b7=1 → "Reader XTAL / Card Clock-less"，否則兩者皆 XTAL；byte1 b5=1 → "Phone off: Force XTAL"；byte2 PLL lock 初始延遲 μs；byte3 連續檢查間隔 μs；byte4 檢查次數 |\n| `A00E` | PMU_CFG | [717](../../nci_decoder/Nxp_pkg/NCI_Core.py#L717) | 依序切 raw hex：IRQ Enable 4B、Power Cfg 3B、DCDC Cfg 5B、TxLdo Cfg 4B、TxLdo Cfg2 4B、TxLdo Vddpa Cfg 4B、TxLdo delay 4B、Startup Wait 4B（共 32B） |\n| `A007` | RSTN_CFG | [736](../../nci_decoder/Nxp_pkg/NCI_Core.py#L736) | b0 存入 global `RSTN_CFG`；b0=1 → "RSTN_internal: Disabled"，0 → "Enabled" |\n| `A08E` | PHONE_OFF_ALLOWED | [744](../../nci_decoder/Nxp_pkg/NCI_Core.py#L744) | value==`01` 且 global `RSTN_CFG==\'1\'` → "Card Emulation in phone off: Enabled"；其餘皆 Disabled |\n| `A009` | TO_BEFORE_STDBY_CFG | [756](../../nci_decoder/Nxp_pkg/NCI_Core.py#L756) | Time = 整個 value 以 **little endian** 十進位 / 1000 s（例：`E8 03` → 1.0 s） |\n| `A01D` | Lx_DEBUG_CFG | [761](../../nci_decoder/Nxp_pkg/NCI_Core.py#L761) | `tbl_general_status`：byte0 b5 Modulation Detected NTF、b4 L1 Events、b3 L2 Reader Events、b2 Felica SystemCode、b1 Felica RF、b0 L2 Events CE；byte1 b5 L2 Events during RF activation ISO14443-3 |\n| `A00F` | MW_AREA | — | 無專屬分支，印 raw |\n| `A0FB` | HW_RESET_NTF | [775](../../nci_decoder/Nxp_pkg/NCI_Core.py#L775) | 印 raw + 固定說明（`0x04` 啟用每次 HW reset 送 CORE_RESET_NTF） |\n\n### Table 98. Poll Mode configuration\n\n| Tag | 名稱 | 行 | Value 解析方式 |\n|---|---|---|---|\n| `A064` | EMVCo_PCD_SETTINGS | [781](../../nci_decoder/Nxp_pkg/NCI_Core.py#L781) | Polling delay = `(byte0 + byte1*256) / 1000` ms（例：`E8 03` → 1.0 ms）；byte2 Max nb of WupA/WupB when LPCD triggered |\n| `A044` | POLL_PROFILE_SEL_CFG | [786](../../nci_decoder/Nxp_pkg/NCI_Core.py#L786) | b0 NFC FORUM / EMVCo PCD profile；b1 Removal / Power OFF on Idle deactivation；b2 Removal / Power OFF on discover deactivation；b3 RFU；b4 Polling Type B first / Type A first；b5 EMVCo PCD polling digital / analog |\n| `A04D`–`A05C` | MFC_KEY-0_CFG … MFC_KEY-15_CFG | — | 無專屬分支，印 raw |\n| `A05D` | FSDI_CFG | [801](../../nci_decoder/Nxp_pkg/NCI_Core.py#L801) | 十進位 Frame Size |\n| `A106` | LPCD_FPC | [805](../../nci_decoder/Nxp_pkg/NCI_Core.py#L805) | Threshold = byte0..1 LE |\n| `A148` | RF_PATTERN_CHK | [809](../../nci_decoder/Nxp_pkg/NCI_Core.py#L809) | byte0 b0 Short RF guard time check（`tbl_general_status`） |\n| `A14B` | PLL_FREQ_CHECK | [814](../../nci_decoder/Nxp_pkg/NCI_Core.py#L814) | 整個 value 查 `tbl_general_status`，查不到 RFU |\n\n### Table 99. Listen Mode Configuration\n\n| Tag | 名稱 | 行 | Value 解析方式 |\n|---|---|---|---|\n| `A080` | TO_RF_OFF_CFG | [819](../../nci_decoder/Nxp_pkg/NCI_Core.py#L819) | byte0..1 LE ms |\n| `A062` | SLOW_HOST_CFG | [824](../../nci_decoder/Nxp_pkg/NCI_Core.py#L824) | `00` 螢幕關閉時繼續送 RF_FIELD_INFO_NTF；`01` 螢幕關閉時停止（除非被外部 reader 成功 activate）；其他 RFU |\n| `A085` | RF_MISC_SETTINGS | [834](../../nci_decoder/Nxp_pkg/NCI_Core.py#L834) | 4B LE 組成 32-bit `b_val`（先印出）。`tbl_g 本文件說明 vendor = \`Nxp\` 時，GID \`0x2\`（NFCEE Management）各 command 的解析方式。Dispatch 表為 [\`Nxp_pkg/__ctrl__.py\`](../../nci_decoder/Nxp_pkg/__ctrl__.py#L53) 的 \`"NFCEE Management"\` 群組，handler 位於 [\`Nxp_pkg/NFCEE_Management.py\`](../../nci_decoder/Nxp_pkg/NFCEE_Management.py)。

**本群組 9 個 handler 全部只是 delegate**：\`Origin.<HANDLER>(raw, "nxp")\`，\`Origin\` = \`nfc_forum_2_0_pkg.NFCEE_Management\`。forum 函式以 \`pkg_import.tbl_import("nxp", ...)\` → \`vendor_registry.resolve()\`（不分大小寫）載入 **\`Nxp_pkg.__table__\`**，因此解析流程與 [forum 版文件](../nfc_forum_2_0/NFCEE_Management.md) 完全相同，唯一差異是查表內容改用 NXP 的表（見 [Tables](Tables.md)）：

| 表 | NXP 版與 forum 版差異（影響輸出） |
|---|---|
| [\`tbl_nfcee_id\`](Tables.md#tbl_nfcee_id) | 多了 SN2x0 具名 ID：\`10\` NFCEE_NDEF、\`80\` NFCEE_UICC1、\`81\` NFCEE_UICC2、\`C0\` NFCEE_eSE、\`C1\` NFCEE_eUICC Profile 1 (SEP/MEP Mode)、\`C2\` NFCEE_eUICC Profile 2 (MEP Mode) |
| [\`tbl_nfcee_status\`](Tables.md#tbl_nfcee_status) | 多了 SN2x0 專屬狀態 \`80\`、\`81\`、\`91\`–\`9B\`（eSE 溫度錯誤、UICC 斷電、eSE reboot / timeout 等） |
| [\`tbl_status_codes\`](Tables.md#tbl_status_codes) | NXP 版 status code 表 |

（\`Nxp_pkg/NFCEE_Management.py\` 的 \`import Nxp_pkg.__table__ as NFC_table\` 在本檔中未被使用。）

### NFCEE ID 欄位的共通解析

NFCEE_DISCOVER_NTF / NFCEE_MODE_SET_CMD / NFCEE_STATUS_NTF / NFCEE_POWER_AND_LINK_CNTRL_CMD 的 NFCEE ID 皆以同一方式輸出：\`* NFCEE ID: <hex> <tbl_nfcee_id.get(id, "")> <tbl_nfcee_id.get(range_key, "")>\`，其中 \`range_key = range_lookup.find_range_key(tbl_nfcee_id, id)\`（\`02-0F\` / \`10-7F\` / \`80-FE\` 範圍 bucket）。所以 NXP 具名 ID 會同時印出名稱與範圍說明，例如 \`C0 NFCEE_eSE (HCI-NFCEE)\`；未具名的 ID 只印範圍，例如 \`11  (NFCEE)\`。
